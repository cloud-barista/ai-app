# Runs the AI-App service, the AI application automation engine, Semaphore and
# two partner institution mocks: the recommender and the natural language agent.
#
# All services come from one image and differ only in the command. The
# mock-partner-* services stand in for the partner institution's infrastructure
# recommendation API and natural language agent; they are not part of this
# prototype. The engine reaches the tools through the AI-App MCP server, the
# natural language agent mock reaches the engine tools through the engine MCP
# server, and the AI-App service forwards engine and partner agent routes to
# them, so the console needs only the AI-App address.
#
# CB-Tumblebug is deliberately not a service here. It brings cb-spider and a
# database with it, and including them would turn "bring this prototype up" into
# "bring a multi-cloud platform up". The defaults reach one running on this
# host at port 1323 with its stock account (default / default); without it
# everything that does not touch a cloud still works.
#
#   docker compose up -d        # starts everything with built-in defaults, no .env needed
#   cp .env.example .env        # to point at another CB-Tumblebug or change a password
#
# The defaults are for a development host on a trusted network: the Semaphore
# admin password is a known one and its UI is published on every interface.
# Set AIAPP_SEMAPHORE_PASSWORD in .env anywhere else.
services:
  # Data lives in ./container-volume on the host. Docker creates a bind-mounted
  # folder that does not exist yet as root, and the services run as other users
  # (the AI-App image as 10001, Semaphore as 1001), so this one-shot service
  # creates the folders and gives each to the user that writes to it. The
  # services that mount them wait for it to finish.
  #
  # The host user cannot read some of those folders, and the Go tools stop at a
  # folder they cannot read (go test ./...). The go.mod it writes makes them
  # treat ./container-volume as another module and skip it.
  volume-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-agent-proto:local
    container_name: aiapp-volume-init
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cd /container-volume
        mkdir -p archive catalog engine-archive partner-nl-archive stage semaphore-config semaphore-data
        [ -f go.mod ] || printf 'module container-volume\n' > go.mod
        chown 10001:10001 archive catalog engine-archive partner-nl-archive stage
        chown 1001:0 semaphore-config semaphore-data
    volumes:
      - ./container-volume:/container-volume

  ai-app-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-agent-proto:local
    container_name: ai-app-server
    command: ["/usr/local/bin/ai-app-server"]
    restart: unless-stopped
    # On stop, running node deployments stop their Semaphore tasks and delete
    # the SSH keys they registered, which may take up to 70 seconds; the
    # default 10 seconds would kill the process with a key still stored.
    stop_grace_period: 80s
    depends_on:
      volume-init:
        condition: service_completed_successfully
    ports:
      - "${AIAPP_SERVER_PORT:-8090}:8090"
    environment:
      AIAPP_SERVER_PORT: "8090"

      # host.docker.internal resolves to the host from inside the container, so
      # the default reaches a CB-Tumblebug running on the developer's own machine
      # rather than to the container's own loopback, where nothing is listening.
      AIAPP_TUMBLEBUG_BASE_URL: "${AIAPP_TUMBLEBUG_BASE_URL:-http://host.docker.internal:1323/tumblebug}"
      # The account a stock CB-Tumblebug starts with.
      AIAPP_TUMBLEBUG_USERNAME: "${AIAPP_TUMBLEBUG_USERNAME:-default}"
      AIAPP_TUMBLEBUG_PASSWORD: "${AIAPP_TUMBLEBUG_PASSWORD:-default}"  # hook:allow
      AIAPP_TUMBLEBUG_TIMEOUT: "${AIAPP_TUMBLEBUG_TIMEOUT:-20m}"
      AIAPP_TUMBLEBUG_SPEC_NAMESPACE: "${AIAPP_TUMBLEBUG_SPEC_NAMESPACE:-system}"

      # The write gate. It stays on unless someone turns it off on purpose, so a
      # container started by accident never runs a playbook on a node or
      # controls one.
      AIAPP_TUMBLEBUG_DRY_RUN: "${AIAPP_TUMBLEBUG_DRY_RUN:-true}"

      # Where engine routes (/aiapp/engine/*) are forwarded, path unchanged.
      AIAPP_ENGINE_URL: "http://ai-automation-engine:8091"

      # Where partner natural language agent routes (/aiapp/partner/nl/*) are
      # forwarded, path unchanged. Here the mock of that agent.
      AIAPP_MOCK_NL_URL: "${AIAPP_MOCK_NL_URL:-http://mock-partner-nl-agent:8093}"

      # Where partner recommendation API routes (/aiapp/partner/rec/*) are
      # forwarded, with /aiapp/partner/rec taken off the path. AI-App does not
      # call it; the console reaches it here. Here the mock of that API.
      AIAPP_PARTNER_REC_URL: "${AIAPP_PARTNER_REC_URL:-http://mock-partner-recommender:8092}"

      # Empty leaves authentication off. The engine and the agent mock get the
      # same token because forwarded routes carry the caller's Authorization
      # header unchanged.
      AIAPP_AUTH_TOKEN: "${AIAPP_AUTH_TOKEN:-}"
      AIAPP_ENGINE_APPROVAL_TOKEN: "${AIAPP_ENGINE_APPROVAL_TOKEN:-}"
      AIAPP_ARCHIVE_DIR: "/app/data/archive"

      # Semaphore runs the deployment playbooks on a node. A token, when set,
      # is used instead of the user name and password.
      AIAPP_SEMAPHORE_URL: "${AIAPP_SEMAPHORE_URL:-http://semaphore:3000}"
      AIAPP_SEMAPHORE_TOKEN: "${AIAPP_SEMAPHORE_TOKEN:-}"
      AIAPP_SEMAPHORE_USERNAME: "${AIAPP_SEMAPHORE_USERNAME:-admin}"
      AIAPP_SEMAPHORE_PASSWORD: "${AIAPP_SEMAPHORE_PASSWORD:-default}"  # hook:allow
      AIAPP_SEMAPHORE_PROJECT: "${AIAPP_SEMAPHORE_PROJECT:-aiapp}"
      AIAPP_SEMAPHORE_POLL_INTERVAL: "${AIAPP_SEMAPHORE_POLL_INTERVAL:-5s}"
      AIAPP_SEMAPHORE_TIMEOUT: "${AIAPP_SEMAPHORE_TIMEOUT:-30m}"
      # Where the semaphore service mounts deploy/ansible.
      AIAPP_SEMAPHORE_PLAYBOOK_DIR: "/ansible"
      # The Semaphore web UI as a browser reaches it. Every playbook run in a
      # deployment record links to its task page there (taskUrl). The default
      # is the port the semaphore service publishes on this host. The console
      # opens such a loopback link on the host name it was itself opened with,
      # so it works from another machine too; other readers of the API need
      # the host address set here. Empty leaves the links out.
      AIAPP_SEMAPHORE_UI_URL: "${AIAPP_SEMAPHORE_UI_URL-http://127.0.0.1:${AIAPP_SEMAPHORE_PORT:-3001}}"

      # Deployment files are placed here and read by Semaphore at the same
      # path, so this must match the stage mount of both services.
      AIAPP_STAGE_ROOT: "/var/lib/aiapp/stage"
      # Records of deployments onto nodes, kept in the archive folder.
      AIAPP_DEPLOYMENT_STORE_FILE: "/app/data/archive/node-deployments.json"
      # Resolved by the deployment service when Langflow's app.envFrom names it.
      AIAPP_DEPLOY_SECRET_LANGFLOW_PASSWORD: "${AIAPP_DEPLOY_SECRET_LANGFLOW_PASSWORD:-}"
      # Once its playbooks succeed, a deployment opens the ports it serves over
      # TCP inbound from 0.0.0.0/0 in the CB-Tumblebug security groups of the
      # node. false records the ports and leaves them for an operator to open.
      AIAPP_DEPLOYMENT_OPEN_PORTS: "${AIAPP_DEPLOYMENT_OPEN_PORTS:-true}"

      # Model and application recommenders registered in internal/recommend,
      # by name. None is built in: empty leaves /aiapp/recommendations/models
      # and /apps answering 501, and a name nothing registered stops the
      # service at startup.
      AIAPP_RECOMMENDER_MODEL: "${AIAPP_RECOMMENDER_MODEL:-}"
      AIAPP_RECOMMENDER_APP: "${AIAPP_RECOMMENDER_APP:-}"
      # Registered models and uploaded applications, kept in the catalog folder
      # so that recreating the container does not lose them.
      AIAPP_MODEL_STORE_FILE: "/app/data/catalog/models.json"
      AIAPP_APP_STORE_DIR: "/app/data/catalog/apps"

    # The archive is the first-year deliverable and the second-year input, so it
    # outlives the container it was written by.
    volumes:
      - ./container-volume/archive:/app/data/archive
      - ./container-volume/catalog:/app/data/catalog
      - ./container-volume/stage:/var/lib/aiapp/stage

    # host.docker.internal is native on Docker Desktop and has to be added on
    # Linux, where the default bridge does not provide it.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8090/aiapp/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The automatic deploy and control engine. It runs fixed workflows as ordered
  # AI-App tool calls and uses no LLM.
  ai-automation-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-agent-proto:local
    container_name: ai-automation-engine
    command: ["/usr/local/bin/ai-automation-engine"]
    restart: unless-stopped
    # Every workflow step is an AI-App tool call, so it starts once that
    # server answers.
    depends_on:
      ai-app-server:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    ports:
      - "${AIAPP_ENGINE_PORT:-8091}:8091"
    environment:
      AIAPP_ENGINE_PORT: "8091"

      # The tools, their grades and the dry-run state all come from here.
      AIAPP_APP_MCP_URL: "http://ai-app-server:8090/aiapp/mcp"

      # The same token as the AI-App service, both to accept and to send.
      AIAPP_AUTH_TOKEN: "${AIAPP_AUTH_TOKEN:-}"
      AIAPP_APP_TOKEN: "${AIAPP_AUTH_TOKEN:-}"
      AIAPP_ENGINE_APPROVAL_TOKEN: "${AIAPP_ENGINE_APPROVAL_TOKEN:-}"
      AIAPP_ENGINE_APPLY_ENABLED: "${AIAPP_ENGINE_APPLY_ENABLED:-false}"
      AIAPP_OBSERVATION_PROMETHEUS_URL: "${AIAPP_OBSERVATION_PROMETHEUS_URL:-}"
      AIAPP_OBSERVATION_PROMETHEUS_TOKEN: "${AIAPP_OBSERVATION_PROMETHEUS_TOKEN:-}"
      AIAPP_OPTIMIZATION_PROPOSAL_DIR: "${AIAPP_OPTIMIZATION_PROPOSAL_DIR:-}"

      # How long a workflow step waiting for a deployment to end keeps asking,
      # and how often.
      AIAPP_HEALTH_TIMEOUT: "${AIAPP_HEALTH_TIMEOUT:-15m}"
      AIAPP_HEALTH_INTERVAL: "${AIAPP_HEALTH_INTERVAL:-20s}"

      AIAPP_ENGINE_ARCHIVE_DIR: "/app/data/engine-archive"

      # Agent registry the engine card is posted to at startup. Empty leaves it off.
      AIAPP_ENGINE_REGISTRY_URL: "${AIAPP_ENGINE_REGISTRY_URL:-}"
      AIAPP_ENGINE_REGISTRY_TOKEN: "${AIAPP_ENGINE_REGISTRY_TOKEN:-}"

    volumes:
      - ./container-volume/engine-archive:/app/data/engine-archive

    # A registry or Prometheus on the host can use the same name as the gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8091/aiapp/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Partner institution natural language agent (mock implementation). It turns
  # an instruction into engine tool calls through a planning model, so it starts
  # once the engine answers.
  mock-partner-nl-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-agent-proto:local
    container_name: mock-partner-nl-agent
    command: ["/usr/local/bin/mock-partner-nl-agent"]
    restart: unless-stopped
    depends_on:
      ai-automation-engine:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    ports:
      - "${AIAPP_MOCK_NL_PORT:-8093}:8093"
    environment:
      AIAPP_MOCK_NL_PORT: "8093"

      # The tools, their grades and the dry-run state all come from here.
      AIAPP_MOCK_NL_ENGINE_MCP_URL: "http://ai-automation-engine:8091/aiapp/engine/mcp"

      # The same token as the other services, both to accept and to send.
      AIAPP_AUTH_TOKEN: "${AIAPP_AUTH_TOKEN:-}"
      AIAPP_MOCK_NL_ENGINE_TOKEN: "${AIAPP_AUTH_TOKEN:-}"

      AIAPP_LLM_BASE_URL: "${AIAPP_LLM_BASE_URL:-https://api.anthropic.com}"
      AIAPP_LLM_API_KEY: "${AIAPP_LLM_API_KEY:-}"
      AIAPP_LLM_MODEL: "${AIAPP_LLM_MODEL:-claude-opus-5}"
      AIAPP_LLM_TIMEOUT: "${AIAPP_LLM_TIMEOUT:-5m}"
      AIAPP_MOCK_NL_MAX_STEPS: "${AIAPP_MOCK_NL_MAX_STEPS:-12}"
      AIAPP_MOCK_NL_ARCHIVE_DIR: "/app/data/partner-nl-archive"

      # Agent registry the card is posted to at startup. Empty leaves it off.
      AIAPP_MOCK_NL_REGISTRY_URL: "${AIAPP_MOCK_NL_REGISTRY_URL:-}"
      AIAPP_MOCK_NL_REGISTRY_TOKEN: "${AIAPP_MOCK_NL_REGISTRY_TOKEN:-}"

    volumes:
      - ./container-volume/partner-nl-archive:/app/data/partner-nl-archive

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8093/aiapp/partner/nl/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Partner institution recommender (mock implementation). It answers the
  # proposed recommendation contract from the CB-Tumblebug spec and image
  # catalogs. The AI-App service does not call it; it forwards
  # /aiapp/partner/rec/* to it so that the console can try the contract.
  mock-partner-recommender:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-agent-proto:local
    container_name: mock-partner-recommender
    command: ["/usr/local/bin/mock-partner-recommender"]
    restart: unless-stopped
    ports:
      - "${AIAPP_MOCK_RECOMMENDER_PORT:-8092}:8092"
    environment:
      AIAPP_MOCK_RECOMMENDER_PORT: "8092"
      # Required of callers when set. Calls forwarded by the AI-App service
      # carry the caller's AIAPP_AUTH_TOKEN, so it defaults to that.
      AIAPP_MOCK_RECOMMENDER_TOKEN: "${AIAPP_MOCK_RECOMMENDER_TOKEN:-${AIAPP_AUTH_TOKEN:-}}"

      AIAPP_TUMBLEBUG_BASE_URL: "${AIAPP_TUMBLEBUG_BASE_URL:-http://host.docker.internal:1323/tumblebug}"
      AIAPP_TUMBLEBUG_USERNAME: "${AIAPP_TUMBLEBUG_USERNAME:-default}"
      AIAPP_TUMBLEBUG_PASSWORD: "${AIAPP_TUMBLEBUG_PASSWORD:-default}"  # hook:allow
      AIAPP_TUMBLEBUG_IMAGE_NAMESPACE: "${AIAPP_TUMBLEBUG_IMAGE_NAMESPACE:-system}"
      AIAPP_TUMBLEBUG_SPEC_NAMESPACE: "${AIAPP_TUMBLEBUG_SPEC_NAMESPACE:-system}"
      AIAPP_TUMBLEBUG_DEFAULT_OS_TYPE: "${AIAPP_TUMBLEBUG_DEFAULT_OS_TYPE:-ubuntu 22.04}"

    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Semaphore UI runs the playbooks of deploy/ansible against a node over SSH.
  # The AI-App service keeps one template per playbook, registers a key and an
  # inventory for each run, and deletes the key and the inventory afterwards.
  #
  # The admin is created on the first start with AIAPP_SEMAPHORE_USERNAME and
  # AIAPP_SEMAPHORE_PASSWORD (admin / default). Semaphore accepts an empty
  # password and then logs anyone in with it, so an unset or empty value falls
  # back to the default instead. The UI is published on every interface, which
  # together with the known default password suits a trusted network only:
  # whoever logs in can run playbooks on the nodes being deployed to.
  semaphore:
    image: semaphoreui/semaphore:v2.12.17
    container_name: aiapp-semaphore
    restart: on-failure:5
    # Its config and data folders have to belong to the Semaphore user before
    # it starts.
    depends_on:
      volume-init:
        condition: service_completed_successfully
    ports:
      - "${AIAPP_SEMAPHORE_PORT:-3001}:3000"
    environment:
      SEMAPHORE_DB_DIALECT: bolt
      ANSIBLE_STDOUT_CALLBACK: ansible.builtin.default
      ANSIBLE_CALLBACK_RESULT_FORMAT: yaml
      SEMAPHORE_ADMIN: "${AIAPP_SEMAPHORE_USERNAME:-admin}"
      SEMAPHORE_ADMIN_PASSWORD: "${AIAPP_SEMAPHORE_PASSWORD:-default}"  # hook:allow
      SEMAPHORE_ADMIN_NAME: "AI-App"
      SEMAPHORE_ADMIN_EMAIL: "admin@localhost"
    volumes:
      - ./deploy/ansible:/ansible:ro
      # Deployment files shared by the AI-App service and Semaphore.
      - ./container-volume/stage:/var/lib/aiapp/stage:ro
      # The generated config.json holds the key that encrypts stored keys, so
      # it is kept with the database.
      - ./container-volume/semaphore-config:/etc/semaphore
      - ./container-volume/semaphore-data:/var/lib/semaphore
