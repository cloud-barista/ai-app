# Copies an application's staged files to the node and runs its script there.
#
# Extra vars (passed by AI-App as the Semaphore task environment):
#   stage_dir      staged folder, as seen inside the Semaphore container
#                  (<AIAPP_STAGE_ROOT>/<deployment id>/<csp>-<node id>)
#   deployment_id  names the folder on the node: /opt/aiapp/<deployment_id>
#   script         file name of the script inside stage_dir, run with bash
#                  from that folder. A .env in the folder is exported first.
- name: Copy staged files and run the application script
  hosts: all
  become: true
  gather_facts: false
  vars:
    app_root: /opt/aiapp
    app_dir: "{{ app_root }}/{{ deployment_id }}"
  tasks:
    - name: Check the required variables
      ansible.builtin.assert:
        that:
          - stage_dir is defined and stage_dir | length > 0
          - deployment_id is defined and deployment_id is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
          - script is defined and script is match('^[A-Za-z0-9][A-Za-z0-9._/-]*$') and '..' not in script
        fail_msg: stage_dir, deployment_id and script are required, and deployment_id and script must be plain names
        quiet: true

    - name: Create the application folder
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copy the staged files
      ansible.builtin.copy:
        src: "{{ stage_dir }}/"
        dest: "{{ app_dir }}/"
        mode: preserve

    - name: Run the script
      ansible.builtin.shell: |
        set -e
        if [ -f .env ]; then
          set -a
          . ./.env
          set +a
        fi
        bash ./{{ script | quote }}
      args:
        chdir: "{{ app_dir }}"
        executable: /bin/bash
      register: script_result
      changed_when: true

    - name: Show the script output
      ansible.builtin.debug:
        var: script_result.stdout_lines
