# Copies a staged compose project to the node, starts it, and optionally waits
# until it answers.
#
# A node runs one model service per engine. Deploying the same work key again
# replaces the files in its folder (tasks/place-files.yml) and the containers
# of its compose project; model services of other engines are left alone.
#
# Extra vars (passed by AI-App as the Semaphore task environment):
#   stage_dir       staged folder with docker-compose.yml, as seen inside the
#                   Semaphore container
#   node_dir        folder on the node: /opt/aiapp/<work key>, where the work
#                   key is ms-<engine>
#   compose_project compose project name: aiapp-<work key>
#   deployment_id   the deployment that ran; not used on the node, only
#                   shown with the task in Semaphore
#   wait_services   optional list of one-shot services that must exit 0 before
#                   the service counts as ready, for example the ollama
#                   model-pull service; waited for with `docker compose wait`
#   wait_timeout    optional, seconds to wait for each of them (default 1800)
#   health_url      optional; polled from the node itself with curl
#   health_retries  optional, attempts before giving up (default 60)
#   health_delay    optional, seconds between attempts (default 10)
#
# Docker must already be installed; run install-docker.yml first.
- name: Start the staged compose project
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Check the compose project name
      ansible.builtin.assert:
        that:
          - compose_project is defined and compose_project is match('^aiapp-[a-z0-9][a-z0-9_-]*$')
        fail_msg: compose_project is required and must be aiapp-<work key>
        quiet: true

    - name: Place the files
      ansible.builtin.include_tasks: tasks/place-files.yml

    # --force-recreate: a redeploy with the same compose file, as heal does,
    # must replace an unhealthy container rather than leave it running.
    - name: Start the project, replacing what the previous deployment left
      ansible.builtin.command:
        argv: [docker, compose, -p, "{{ compose_project }}", up, -d, --remove-orphans, --force-recreate]
        chdir: "{{ node_dir }}"
      register: compose_result
      changed_when: true

    - name: Show the compose output
      ansible.builtin.debug:
        var: compose_result.stderr_lines

    - name: Wait until the one-shot services exit
      ansible.builtin.shell: >-
        timeout {{ wait_timeout | default(1800) | int }}
        docker compose -p {{ compose_project | quote }} wait {{ item | quote }}
      args:
        chdir: "{{ node_dir }}"
      loop: "{{ wait_services | default([]) }}"
      register: wait_result
      changed_when: false
      # Compose v5.6 prints 'container "<id>" exited with status code <n>'
      # and exits with <n>; the output is checked too, in case a compose
      # version exits 0 whatever the code it prints.
      failed_when: >-
        wait_result.rc != 0 or
        (wait_result.stdout | trim) is not search('(^|\\s)0$')

    - name: Wait until the service answers
      ansible.builtin.command:
        argv: [curl, -fsS, -o, /dev/null, --max-time, "10", "{{ health_url }}"]
      register: health_result
      until: health_result.rc == 0
      retries: "{{ health_retries | default(60) | int }}"
      delay: "{{ health_delay | default(10) | int }}"
      changed_when: false
      when: health_url is defined and health_url | length > 0
