basePath: /aiapp
definitions:
  catalogsync.SourceResult:
    properties:
      checkedAt:
        example: "2026-11-04T03:00:00Z"
        type: string
      counts:
        allOf:
        - $ref: '#/definitions/modelcat.SyncCounts'
        description: |-
          Counts is what the returned models did to the catalog. All zero when
          the source was skipped or its fetch failed: the catalog is not touched
          then.
      error:
        description: |-
          Error is why the last fetch from the source failed. Empty when it did
          not.
        example: 'huggingface: GET /api/models: 503 Service Unavailable'
        type: string
      fetched:
        description: Fetched is how many models the source returned.
        example: 96
        type: integer
      finishedAt:
        example: "2026-11-04T03:00:12Z"
        type: string
      name:
        description: Name is the source, the origin its models are stored with.
        example: huggingface
        type: string
      reachable:
        description: |-
          Reachable is whether the source's host answered the check before the
          last run, and CheckedAt is when that check was made. Both are absent
          until the source has been checked once.
        example: true
        type: boolean
      skipped:
        description: |-
          Skipped is why the last run did not fetch from the source:
          "unreachable" when its host did not answer. The catalog is not touched
          then. Empty when the source was fetched.
        enum:
        - unreachable
        example: ""
        type: string
      startedAt:
        description: |-
          StartedAt and FinishedAt bound the last run of the source. Both are
          absent until the source has run once.
        example: "2026-11-04T03:00:00Z"
        type: string
      unreachable:
        description: |-
          Unreachable is why the reachability check failed, such as a timeout
          or a TLS certificate the client does not trust. Empty when the host
          answered.
        example: 'Head "https://huggingface.co": context deadline exceeded'
        type: string
    type: object
  catalogsync.Status:
    properties:
      enabled:
        description: Enabled is false when AIAPP_CATALOG_SYNC_ENABLED is off.
        example: true
        type: boolean
      interval:
        description: |-
          Interval is how long the sync waits between scheduled runs while a
          source is reachable, as a Go duration. Empty when the sync is disabled.
        example: 24h0m0s
        type: string
      nextRunAt:
        description: |-
          NextRunAt is when the next scheduled run starts. Absent while a run is
          in progress, before the schedule has started and when the sync is
          disabled.
        example: "2026-11-05T03:00:00Z"
        type: string
      offline:
        description: |-
          Offline is true when the last run reached no source. The schedule then
          retries sooner than the interval: after 5m, 15m, then every 1h, never
          later than the interval.
        example: false
        type: boolean
      running:
        description: Running is true while a run is in progress.
        example: false
        type: boolean
      sources:
        description: |-
          Sources holds the last result of each configured source, in the
          configured order.
        items:
          $ref: '#/definitions/catalogsync.SourceResult'
        type: array
    type: object
  engine.Card:
    properties:
      description:
        type: string
      displayName:
        type: string
      dryRun:
        description: DryRun is the AI-App dry-run state, as of the current MCP session.
        type: boolean
      framework:
        example: AI-Ops
        type: string
      mcp:
        $ref: '#/definitions/engine.CardMCP'
      mcpEndpoint:
        type: string
      name:
        example: ai-mcmp-app-automation-engine
        type: string
      owner:
        example: innogrid
        type: string
      registration:
        allOf:
        - $ref: '#/definitions/model.AgentRegistration'
        description: |-
          Registration is how the last registry registration went. It is left out
          of the card sent to the registry.
      servesFramework:
        example: AI-App
        type: string
      tools:
        $ref: '#/definitions/engine.CardToolGroup'
      usesLLM:
        description: 'UsesLLM is always false: the workflows are fixed.'
        type: boolean
      version:
        example: 0.1.0
        type: string
      workflowEndpoint:
        type: string
      workflows:
        example:
        - deploy
        - heal
        - control
        - status
        items:
          type: string
        type: array
    type: object
  engine.CardMCP:
    properties:
      appServer:
        $ref: '#/definitions/engine.CardMCPServer'
    type: object
  engine.CardMCPServer:
    properties:
      connected:
        type: boolean
      toolCount:
        type: integer
      url:
        example: http://127.0.0.1:8090/aiapp/mcp
        type: string
    type: object
  engine.CardToolGroup:
    properties:
      exposed:
        items:
          $ref: '#/definitions/model.AgentCardTool'
        type: array
      uses:
        description: |-
          Uses names the AI-App tools the engine calls, whether or not it is
          connected. A tool carries its grade only while the engine is connected
          to an AI-App service that publishes it.
        items:
          $ref: '#/definitions/model.AgentCardTool'
        type: array
    type: object
  engine.Run:
    properties:
      dryRun:
        description: DryRun is the AI-App dry-run state the run executed under.
        type: boolean
      endedAt:
        type: string
      input: {}
      message:
        type: string
      nsId:
        example: default
        type: string
      runId:
        example: eng-mbt3x2k1
        type: string
      startedAt:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/engine.RunStatus'
        enum:
        - succeeded
        - failed
        - blocked
        example: blocked
      steps:
        items:
          $ref: '#/definitions/engine.Step'
        type: array
      workflow:
        enum:
        - deploy
        - heal
        - control
        - status
        example: deploy
        type: string
    type: object
  engine.RunListResp:
    properties:
      runs:
        items:
          $ref: '#/definitions/engine.Run'
        type: array
    type: object
  engine.RunStatus:
    enum:
    - succeeded
    - failed
    - blocked
    type: string
    x-enum-varnames:
    - RunSucceeded
    - RunFailed
    - RunBlocked
  engine.Step:
    properties:
      endedAt:
        type: string
      error:
        type: string
      index:
        type: integer
      input: {}
      message:
        description: |-
          Message says why a step was blocked, waits or was skipped, or what its
          result meant for the workflow.
        type: string
      name:
        example: create the deployment
        type: string
      output:
        description: Output is the tool result as the AI-App service returned it.
        type: object
      startedAt:
        description: StartedAt and EndedAt are absent on a step that was not run.
        type: string
      status:
        allOf:
        - $ref: '#/definitions/engine.StepStatus'
        enum:
        - succeeded
        - failed
        - blocked
        - waiting
        - skipped
        example: succeeded
      tool:
        description: Tool is the AI-App MCP tool the step calls.
        example: create_deployment
        type: string
    type: object
  engine.StepStatus:
    enum:
    - succeeded
    - failed
    - blocked
    - waiting
    - skipped
    type: string
    x-enum-varnames:
    - StepSucceeded
    - StepFailed
    - StepBlocked
    - StepWaiting
    - StepSkipped
  model.AgentCardTool:
    properties:
      grade:
        description: Grade is one of read, review, write, destructive.
        type: string
      guardedByDryRun:
        type: boolean
      name:
        type: string
    type: object
  model.AgentRegistration:
    properties:
      at:
        type: string
      message:
        type: string
      registryUrl:
        type: string
      status:
        description: Status is disabled, pending, registered or failed.
        example: registered
        type: string
    type: object
  model.App:
    properties:
      name:
        description: |-
          Name identifies the application: lower case letters, digits, "_" and
          "-", at most 63 characters. Uploading again under the same name adds a
          version.
        example: open-webui
        type: string
      versions:
        description: Versions are the uploaded versions, oldest first.
        items:
          $ref: '#/definitions/model.AppVersion'
        type: array
    type: object
  model.AppFile:
    properties:
      name:
        description: |-
          Name is the file name on the node: letters, digits, ".", "_", "+" and
          "-", not starting with ".", at most 255 characters.
        example: docker-compose.yml
        type: string
      sha256:
        description: SHA256 is the hex encoded SHA-256 digest of the file content.
        example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        type: string
      sizeBytes:
        description: SizeBytes is the file size in bytes.
        example: 812
        type: integer
    type: object
  model.AppListResp:
    properties:
      apps:
        items:
          $ref: '#/definitions/model.App'
        type: array
    type: object
  model.AppVersion:
    properties:
      createdAt:
        description: CreatedAt is when the version was registered.
        example: "2026-10-29T12:00:00Z"
        type: string
      files:
        description: |-
          Files are the uploaded files, in upload order. They are copied flat into
          the folder the script runs in.
        items:
          $ref: '#/definitions/model.AppFile'
        type: array
      ports:
        description: |-
          Ports are the TCP ports the application serves on the node. A
          deployment opens them inbound in the node's CB-Tumblebug security
          groups. Empty opens nothing.
        example:
        - 3000
        - 8080
        items:
          type: integer
        type: array
      script:
        description: |-
          Script is the shell script run on the node from the folder the files
          are copied to. At most 64 KiB.
        example: docker compose up -d
        type: string
      version:
        description: |-
          Version numbers the uploads of one name from 1, one higher than the
          highest version present when it was uploaded.
        example: 1
        type: integer
    type: object
  model.ArchiveListResp:
    properties:
      records:
        items:
          $ref: '#/definitions/model.ArchiveRecord'
        type: array
    type: object
  model.ArchiveRecord:
    properties:
      answer:
        type: string
      endedAt:
        type: string
      error:
        type: string
      intent:
        type: string
      kind:
        example: intent
        type: string
      nsId:
        type: string
      runId:
        type: string
      startedAt:
        type: string
      steps:
        items:
          $ref: '#/definitions/model.ToolStep'
        type: array
      usage:
        $ref: '#/definitions/model.TokenUsage'
    type: object
  model.Artifact:
    properties:
      format:
        description: |-
          Format is the file format the runtime loads: hf for Hugging Face
          safetensors, gguf for GGUF. Filter with ?format=.
        example: hf
        type: string
      id:
        description: |-
          ID identifies the artifact within its model, with the same character
          rules as a model ID.
        example: hf-bf16
        type: string
      precision:
        description: |-
          Precision is the precision or quantization exactly as the source states
          it, such as BF16, FP8 or Q4_K_M. It is not normalized. Empty means
          unknown.
        example: BF16
        type: string
      ref:
        description: |-
          Ref is the name of the artifact at its source: a Hugging Face repository
          id, an Ollama model tag, or an image reference.
        example: Qwen/Qwen3-VL-8B-Instruct
        type: string
      runtimes:
        description: |-
          Runtimes are the inference runtimes known to load this artifact. Each
          runtime must be listed explicitly: the same file format may load in one
          runtime version and not in another. Filter with ?runtimeId=. An empty
          list means no runtime is known to load the artifact: it is listed but
          cannot be deployed.
        items:
          $ref: '#/definitions/model.RuntimeCompat'
        type: array
      sizeGiB:
        description: |-
          SizeGiB is the download size in GiB (2^30 bytes). Zero or absent means
          unknown.
        example: 16.3
        type: number
      source:
        description: |-
          Source is where the artifact is downloaded from, such as huggingface,
          kaggle, ollama or docker-model-runner. Filter with ?source=.
        example: huggingface
        type: string
    required:
    - format
    - id
    - ref
    - source
    type: object
  model.DependencyStatus:
    properties:
      latencyMs:
        description: |-
          LatencyMs is how long the reachability call took, in milliseconds.
          Absent when it did not answer.
        example: 3
        type: integer
      message:
        description: Message says what was found, or why a check failed.
        example: CB-Tumblebug is ready
        type: string
      reachable:
        description: Reachable is whether it answered.
        example: true
        type: boolean
      url:
        description: URL is where it is called, without credentials.
        example: http://cb-tumblebug:1323/tumblebug
        type: string
      version:
        description: Version is the version it reports, when it reports one.
        example: v2.12.17-5767d93-1741607759
        type: string
    type: object
  model.Endpoint:
    properties:
      artifactId:
        description: ArtifactID is the artifact of that model. Inference only.
        example: hf-bf16
        type: string
      csp:
        description: CSP is the cloud of the node, in lower case.
        example: aws
        type: string
      deployedAt:
        description: DeployedAt is when the deployment finished on the node.
        example: "2026-11-03T12:05:00Z"
        type: string
      deploymentId:
        description: |-
          DeploymentID is the deployment serving the work key on the node; read
          it with GET /deployments/{id} and take it down with
          DELETE /deployments/{id}.
        example: 3f9b2c4e-8a51-4d27-9e0c-5b1f6a7d2e48
        type: string
      healthUrl:
        description: |-
          HealthURL answers 200 once the runtime is up:
          http://<host>:<runtime port><runtime healthPath>. Inference only, and
          only when the runtime profile names a health path.
        example: http://203.0.113.10:8000/health
        type: string
      host:
        description: |-
          Host is the address the node was reached at and the URLs are built
          from: its public IP, or its private IP when it has none.
        example: 203.0.113.10
        type: string
      infraId:
        description: InfraID is the CB-Tumblebug Infra of the node.
        example: travel
        type: string
      modelId:
        description: ModelID is the model of the model catalog served. Inference only.
        example: qwen3-embedding-0.6b
        type: string
      name:
        description: Name is the uploaded application. App only.
        example: open-webui
        type: string
      nodeId:
        description: NodeID is the node within the Infra.
        example: vm1
        type: string
      notes:
        description: |-
          Notes are the notes of the node result, such as port opening being
          turned off.
        items:
          type: string
        type: array
      nsId:
        description: NsID is the CB-Tumblebug namespace of the node.
        example: etri
        type: string
      openedPorts:
        description: |-
          OpenedPorts are, per security group and port, the inbound rules found
          or added when the deployment ran.
        items:
          $ref: '#/definitions/model.NodeOpenedPort'
        type: array
      ports:
        description: Ports are the TCP ports the deployment serves on the node.
        example:
        - 8000
        items:
          type: integer
        type: array
      portsError:
        description: PortsError is why some ports could not be opened.
        type: string
      portsOpened:
        description: |-
          PortsOpened is true when every port in ports was found or added as an
          inbound rule in a CB-Tumblebug security group of the node and no port
          failed. False means the URLs may not be reachable from outside the
          node: portsError or notes say why.
        example: true
        type: boolean
      region:
        description: Region and Zone are where the node runs.
        example: ap-northeast-2
        type: string
      runtimeId:
        description: RuntimeID is the inference runtime profile. Inference only.
        example: vllm
        type: string
      type:
        description: Type is inference or app.
        enum:
        - inference
        - app
        example: inference
        type: string
      url:
        description: |-
          URL is the OpenAI compatible API of an inference service:
          http://<host>:<runtime port><runtime apiBasePath>. Inference only.
        example: http://203.0.113.10:8000/v1
        type: string
      urls:
        description: |-
          URLs are http://<host>:<port> for every port the application serves.
          App only; absent when the application serves no port.
        items:
          $ref: '#/definitions/model.EndpointURL'
        type: array
      version:
        description: Version is the application version deployed. App only.
        example: 1
        type: integer
      workKey:
        description: |-
          WorkKey is what serves on the node: ms-<runtimeId> for an inference
          service, app-<name> for an application. A node serves one endpoint per
          work key.
        example: ms-vllm
        type: string
      zone:
        example: ap-northeast-2a
        type: string
    type: object
  model.EndpointListResp:
    properties:
      endpoints:
        description: Endpoints are ordered by nsId, infraId, nodeId and workKey.
        items:
          $ref: '#/definitions/model.Endpoint'
        type: array
    type: object
  model.EndpointURL:
    properties:
      port:
        description: Port is the TCP port.
        example: 3000
        type: integer
      url:
        description: URL is http://<host>:<port>.
        example: http://203.0.113.10:3000
        type: string
    type: object
  model.Model:
    properties:
      artifacts:
        description: |-
          Artifacts are the published forms of the model that a runtime can load.
          At least one is required.
        items:
          $ref: '#/definitions/model.Artifact'
        type: array
      contextLength:
        description: |-
          ContextLength is the context window in tokens. Zero or absent means
          unknown, not unlimited.
        example: 262144
        type: integer
      family:
        description: Family is the model family the model belongs to.
        example: qwen3-vl
        type: string
      id:
        description: |-
          ID is the catalog identifier: lower case letters, digits, ".", "_" and
          "-", at most 63 characters.
        example: qwen3-vl-8b
        type: string
      inputModalities:
        description: |-
          InputModalities are the kinds of input the model accepts, such as text or
          image. Filter with ?modality=.
        example:
        - text
        - image
        items:
          type: string
        type: array
      license:
        description: License is the license identifier of the weights. Empty means
          unknown.
        example: apache-2.0
        type: string
      name:
        description: Name is the display name, usually the name the publisher uses.
        example: Qwen3-VL-8B-Instruct
        type: string
      origin:
        description: |-
          Origin is who put the model in the catalog: seed for a built-in model,
          manual for a model registered or edited through POST /models, or the
          source the catalog sync collected it from (huggingface, ollama,
          docker-model-runner, ngc, kaggle). Absent is read as manual. POST /models
          always records manual. Filter with ?origin=.
        enum:
        - seed
        - manual
        - huggingface
        - ollama
        - docker-model-runner
        - ngc
        - kaggle
        example: huggingface
        type: string
      parameters:
        description: Parameters is the parameter count as the publisher writes it.
        example: 8B
        type: string
      publisher:
        description: Publisher is who released the model.
        example: Qwen
        type: string
      stale:
        description: |-
          Stale is true when the source of a collected model no longer lists it.
          The entry is kept, and turns false again when the source lists it again.
        example: false
        type: boolean
      syncedAt:
        description: |-
          SyncedAt is the last time the catalog sync saw the model at its source.
          Absent for a model the sync does not keep.
        example: "2026-11-04T03:00:00Z"
        type: string
      tasks:
        description: |-
          Tasks are what the model is used for, such as chat, vision-chat or
          embedding. Filter with ?task=.
        example:
        - vision-chat
        items:
          type: string
        type: array
    required:
    - artifacts
    - id
    - name
    type: object
  model.ModelListResp:
    properties:
      models:
        items:
          $ref: '#/definitions/model.Model'
        type: array
    type: object
  model.NodeAppReq:
    properties:
      env:
        additionalProperties:
          type: string
        description: |-
          Env is written to the .env file in the folder the script runs in, and
          exported before the script starts. Names match [A-Z_][A-Z0-9_]*; values
          hold no line break and no single quote. Addresses of other nodes go
          here.
        type: object
      name:
        description: Name is an uploaded application (GET /apps).
        example: open-webui
        type: string
      ports:
        description: |-
          Ports replace, for this deployment, the ports the application version
          was uploaded with: the TCP ports opened inbound in the node's
          CB-Tumblebug security groups, each from 1 to 65535, at most 16.
          Omitted takes the version's ports.
        example:
        - 3000
        items:
          type: integer
        type: array
      version:
        description: |-
          Version is the version to deploy. 0 takes the latest; the record keeps
          the version taken.
        example: 1
        type: integer
    required:
    - name
    type: object
  model.NodeControlReq:
    properties:
      action:
        description: Action is passed to CB-Tumblebug node control.
        enum:
        - suspend
        - resume
        - reboot
        - terminate
        example: reboot
        type: string
    required:
    - action
    type: object
  model.NodeControlResp:
    properties:
      action:
        example: reboot
        type: string
      id:
        example: 3f9b2c4e-8a51-4d27-9e0c-5b1f6a7d2e48
        type: string
      nodes:
        description: Nodes are the per node results, in deployment order.
        items:
          $ref: '#/definitions/model.NodeControlResult'
        type: array
    type: object
  model.NodeControlResult:
    properties:
      message:
        description: Message is the CB-Tumblebug answer, or why nothing was sent.
        example: Rebooting the node vm1
        type: string
      status:
        description: |-
          Status is done, failed, or blocked when nothing was sent because the
          service or the deployment is in dry run.
        enum:
        - done
        - failed
        - blocked
        example: done
        type: string
      target:
        $ref: '#/definitions/model.NodeDeployTarget'
    type: object
  model.NodeDeployNode:
    properties:
      csp:
        description: CSP is the cloud, from connectionConfig.providerName, in lower
          case.
        example: aws
        type: string
      host:
        description: Host is the public IP, or the private IP when the node has none.
        example: 203.0.113.10
        type: string
      port:
        description: Port is the SSH port.
        example: 22
        type: integer
      region:
        description: Region and Zone are where the node runs.
        example: ap-northeast-2
        type: string
      specId:
        description: SpecID is the node spec in CB-Tumblebug.
        example: aws+ap-northeast-2+g4dn.xlarge
        type: string
      user:
        description: |-
          User is the SSH user CB-Tumblebug reports for the node. The
          playbooks ran as nodes[].sshUser, which differs when the target
          gave sshUser or the node refused this user (sshUserSource).
        example: cb-user
        type: string
      zone:
        example: ap-northeast-2a
        type: string
    type: object
  model.NodeDeployNodeLogs:
    properties:
      status:
        example: running
        type: string
      steps:
        items:
          $ref: '#/definitions/model.NodeDeployStep'
        type: array
      target:
        $ref: '#/definitions/model.NodeDeployTarget'
    type: object
  model.NodeDeployResult:
    properties:
      compose:
        description: Compose is the rendered docker-compose.yml of an inference service.
        type: string
      error:
        description: Error is why the node failed, or why taking it down failed.
        type: string
      finishedAt:
        description: FinishedAt is when work on the node ended.
        example: "2026-10-29T12:04:59Z"
        type: string
      gpu:
        description: |-
          GPU is whether the runtime was given the node's GPUs and the NVIDIA
          Container Toolkit was installed.
        example: false
        type: boolean
      gpuCheck:
        description: |-
          GPUCheck is, for an inference service given the GPU, what compose-up
          found on the node showing that the runtime runs on it: the method
          (nvidia-smi or log) and the nvidia-smi compute process or the log line.
          When the runtime is not on the GPU the node fails instead. Absent
          without GPU, for an app and for a dry run.
        example: 'nvidia-smi: 3499, VLLM::EngineCore, 13524 MiB'
        type: string
      gpuSource:
        description: |-
          GPUSource says where GPU came from: request, spec, or default when the
          spec could not be read.
        enum:
        - request
        - spec
        - default
        example: spec
        type: string
      node:
        allOf:
        - $ref: '#/definitions/model.NodeDeployNode'
        description: |-
          Node is how the node was reached, as read from CB-Tumblebug. Absent
          when the node could not be read. The SSH key is never included.
      nodeDir:
        description: |-
          NodeDir is the folder on the node the files were copied to,
          /opt/aiapp/<work key>. Its compose project is aiapp-<work key>.
        example: /opt/aiapp/ms-vllm
        type: string
      notes:
        description: |-
          Notes record decisions made for this node, such as why the spec could
          not be read.
        items:
          type: string
        type: array
      openedPorts:
        description: |-
          OpenedPorts are, per security group and port, the inbound rules found
          or added in CB-Tumblebug. Taking the deployment down closes none of
          them, since other workloads may share the group.
        items:
          $ref: '#/definitions/model.NodeOpenedPort'
        type: array
      phase:
        description: |-
          Phase is what the service is doing on the node: reading-node (the node
          and its SSH key are read from CB-Tumblebug), staging (the files are
          placed in the stage folder), checking-ssh (the SSH user is tried),
          waiting-node-lock (another deployment of the same work key on the node
          runs first), install-docker, compose-up, copy-and-run or compose-down
          (that playbook runs; steps[] holds its task), opening-ports (the served
          ports are opened in the security groups) and done once the node
          succeeded. A node that failed keeps the phase it failed in. Absent until
          work on the node begins, and for records written before phases were
          kept.
        enum:
        - reading-node
        - staging
        - checking-ssh
        - waiting-node-lock
        - install-docker
        - compose-up
        - copy-and-run
        - compose-down
        - opening-ports
        - done
        example: compose-up
        type: string
      phaseStartedAt:
        description: PhaseStartedAt is when the node entered Phase.
        example: "2026-10-29T12:00:40Z"
        type: string
      ports:
        description: |-
          Ports are the TCP ports the deployment serves on the node: the runtime
          port of an inference service, the ports of an application. They are
          opened inbound from 0.0.0.0/0 in every security group of the node once
          the playbooks succeed. A dry run and a failed node open none; with
          port opening turned off (AIAPP_DEPLOYMENT_OPEN_PORTS=false) none are
          opened and notes says so.
        example:
        - 8000
        items:
          type: integer
        type: array
      portsError:
        description: |-
          PortsError is why some ports could not be opened. The node still
          succeeds; the ports can be opened in CB-Tumblebug by hand.
        type: string
      removedAt:
        description: RemovedAt is when the deployment was taken down from the node.
        example: "2026-11-03T12:00:00Z"
        type: string
      serviceUrl:
        description: |-
          ServiceURL is the inference API on the node, built from the public or
          private IP the node was reached at, the runtime port and its API base
          path. Inference services only.
        example: http://203.0.113.10:8000/v1
        type: string
      sshUser:
        description: |-
          SSHUser is the SSH user the playbooks ran as on the node: the
          target's sshUser when given. Otherwise node.user, the one CB-Tumblebug
          reports, is tried with the node key before the playbooks run; when the
          node refuses it, the default users of the node image (such as ec2-user
          on RHEL and Amazon Linux) are tried and the first it accepts is taken.
          Taking the deployment down runs as the same user.
        example: cb-user
        type: string
      sshUserSource:
        description: |-
          SSHUserSource says where SSHUser came from: request (targets[].sshUser),
          tumblebug (node.user, which the node accepted, or which was kept because
          the login could not be tried or every user was refused; notes say which)
          or fallback (an image default user, taken after the node refused
          node.user; notes name both).
        enum:
        - request
        - tumblebug
        - fallback
        example: tumblebug
        type: string
      stageDir:
        description: |-
          StageDir is the folder the files were placed in on the shared stage
          volume: <AIAPP_STAGE_ROOT>/<deployment id>/<csp>-<node id>.
        example: /var/lib/aiapp/stage/3f9b2c4e-8a51-4d27-9e0c-5b1f6a7d2e48/aws-vm1
        type: string
      startedAt:
        description: StartedAt is when work on the node began.
        example: "2026-10-29T12:00:01Z"
        type: string
      status:
        description: |-
          Status is pending, deploying, running, failed, dry-run or interrupted;
          once taken down, removing, removed or remove-failed.
        enum:
        - pending
        - deploying
        - running
        - failed
        - dry-run
        - interrupted
        - removing
        - removed
        - remove-failed
        example: running
        type: string
      steps:
        description: |-
          Steps are the playbooks run on the node, in order. A step that failed
          ends the node.
        items:
          $ref: '#/definitions/model.NodeDeployStep'
        type: array
      target:
        allOf:
        - $ref: '#/definitions/model.NodeDeployTarget'
        description: Target is the target as requested.
      workKey:
        description: |-
          WorkKey names what the deployment occupies on the node: ms-<runtime>
          for an inference service, app-<name> for an application. A later deployment of
          the same work key to the same node replaces this one there.
        example: ms-vllm
        type: string
    type: object
  model.NodeDeployStep:
    properties:
      cleanupErrors:
        description: |-
          CleanupErrors name the Semaphore key or inventory of this run that
          could not be deleted. A key named here may still be stored in Semaphore.
        items:
          type: string
        type: array
      currentTask:
        description: |-
          CurrentTask is the Ansible task the playbook is on, from the last
          TASK [...] line of the log so far, such as "Wait until the service
          answers". Once the playbook ended it is the task it stopped on when it
          did not succeed, and empty when it succeeded.
        example: Wait until the service answers
        type: string
      error:
        description: Error is why the run could not be registered, started or followed.
        type: string
      finishedAt:
        example: "2026-10-29T12:02:10Z"
        type: string
      output:
        description: |-
          Output is the task log, one line per entry: the log so far while the
          task runs, then the whole log. It is returned by
          GET /deployments/{id}/logs and left out of the deployment record.
        items:
          type: string
        type: array
      playbook:
        description: |-
          Playbook is install-docker.yml, compose-up.yml, copy-and-run.yml, or
          compose-down.yml when the deployment was taken down.
        example: compose-up.yml
        type: string
      sshUser:
        description: SSHUser is the SSH user the playbook ran as.
        example: cb-user
        type: string
      startedAt:
        example: "2026-10-29T12:00:02Z"
        type: string
      status:
        description: |-
          Status is the Semaphore task status: waiting, starting, running or
          stopping while the task runs (read every 5 seconds), then the final one,
          success, error, stopped or rejected. Empty while the task is being
          registered and when it never started. TaskID and TaskURL are set as soon
          as the task starts.
        example: success
        type: string
      taskId:
        description: TaskID is the Semaphore task, kept in Semaphore with its log.
        example: 2147483645
        type: integer
      taskUrl:
        description: |-
          TaskURL is the page of the task in the Semaphore web UI, with its log.
          Absent when the task never started or AIAPP_SEMAPHORE_UI_URL was not
          set when it ran.
        example: http://203.0.113.5:3001/project/1/history?t=42
        type: string
    type: object
  model.NodeDeployTarget:
    properties:
      infraId:
        description: InfraID is the CB-Tumblebug Infra the node belongs to.
        example: travel
        type: string
      k8sClusterId:
        description: K8sClusterID is reserved for kind "k8s".
        example: ""
        type: string
      kind:
        description: |-
          Kind is "node". "k8s" is reserved for Kubernetes clusters and refused
          with 422.
        enum:
        - node
        - k8s
        example: node
        type: string
      nodeGroupId:
        description: NodeGroupID is reserved for kind "k8s".
        example: ""
        type: string
      nodeId:
        description: NodeID is the node within the Infra.
        example: vm1
        type: string
      nsId:
        description: NsID is the CB-Tumblebug namespace of the Infra.
        example: etri
        type: string
      sshUser:
        description: |-
          SSHUser replaces, for this node, the SSH user CB-Tumblebug reports
          (nodeUserName) in the Semaphore inventory; the SSH key is still the one
          CB-Tumblebug holds for the node. Without it, the CB-Tumblebug user is
          tried with the key before the playbooks run, and when the node refuses
          it (CB-Tumblebug could not create cb-user on the image), the image's
          default users are tried. Give it to choose the user, and no login is
          tried. 1 to 32 characters matching [a-z_][a-z0-9_-]*. Taking the
          deployment down uses the user recorded at deploy time.
        example: ec2-user
        type: string
    required:
    - kind
    - nsId
    type: object
  model.NodeDeployment:
    properties:
      createdAt:
        description: CreatedAt is when the request was accepted.
        example: "2026-10-29T12:00:00Z"
        type: string
      dryRun:
        description: |-
          DryRun is true when the service ran with dry run on: only the node
          look-up and file placement were done.
        example: false
        type: boolean
      error:
        description: Error is why the deployment as a whole stopped, when it did.
        type: string
      finishedAt:
        description: FinishedAt is when the last node finished. Absent while it runs.
        example: "2026-10-29T12:05:00Z"
        type: string
      id:
        description: |-
          ID is a UUID (version 4). It names the stage folder. The folder on each
          node is named after the work key instead; see NodeDeployResult.NodeDir.
        example: 3f9b2c4e-8a51-4d27-9e0c-5b1f6a7d2e48
        type: string
      nodes:
        description: Nodes are the per node results, in request order.
        items:
          $ref: '#/definitions/model.NodeDeployResult'
        type: array
      removedAt:
        description: |-
          RemovedAt is when taking the deployment down ended, removed or
          remove-failed. Absent until then.
        example: "2026-11-03T12:00:00Z"
        type: string
      request:
        allOf:
        - $ref: '#/definitions/model.NodeDeploymentReq'
        description: |-
          Request is the request as accepted, with the runtime and app version
          that were taken filled in.
      status:
        description: |-
          Status is pending, deploying, running (every node), failed (every
          node), partial (some nodes), dry-run (files placed, nothing run) or
          interrupted (the service stopped while it was deploying); once taken
          down with DELETE /deployments/{id}, removing, removed or remove-failed.
        enum:
        - pending
        - deploying
        - running
        - failed
        - partial
        - dry-run
        - interrupted
        - removing
        - removed
        - remove-failed
        example: running
        type: string
      type:
        description: Type is the request type.
        enum:
        - inference
        - app
        example: inference
        type: string
    type: object
  model.NodeDeploymentListResp:
    properties:
      deployments:
        description: Deployments are ordered newest first, without task output.
        items:
          $ref: '#/definitions/model.NodeDeployment'
        type: array
    type: object
  model.NodeDeploymentLogs:
    properties:
      id:
        example: 3f9b2c4e-8a51-4d27-9e0c-5b1f6a7d2e48
        type: string
      nodes:
        description: Nodes hold, per target, the steps with their output.
        items:
          $ref: '#/definitions/model.NodeDeployNodeLogs'
        type: array
      status:
        example: running
        type: string
    type: object
  model.NodeDeploymentProgress:
    properties:
      count:
        allOf:
        - $ref: '#/definitions/model.NodeProgressCount'
        description: Count is how many nodes are in each state.
      createdAt:
        example: "2026-10-29T12:00:00Z"
        type: string
      done:
        description: |-
          Done is false while the service still works on the deployment
          (pending, deploying or removing) and true otherwise: polling can stop.
        example: false
        type: boolean
      elapsedSeconds:
        description: |-
          ElapsedSeconds runs from createdAt to finishedAt (or removedAt once
          taken down), or to now while the deployment is not done.
        example: 312
        type: integer
      error:
        description: Error is why the deployment as a whole stopped, when it did.
        type: string
      finishedAt:
        description: |-
          FinishedAt is when the last node finished deploying; RemovedAt when
          taking it down ended.
        example: "2026-10-29T12:05:00Z"
        type: string
      id:
        example: 3f9b2c4e-8a51-4d27-9e0c-5b1f6a7d2e48
        type: string
      nodes:
        description: Nodes are the per node progress, in request order.
        items:
          $ref: '#/definitions/model.NodeProgress'
        type: array
      removedAt:
        type: string
      status:
        description: Status is the deployment status, as in GET /deployments/{id}.
        enum:
        - pending
        - deploying
        - running
        - failed
        - partial
        - dry-run
        - interrupted
        - removing
        - removed
        - remove-failed
        example: deploying
        type: string
      succeeded:
        description: |-
          Succeeded is true when the deployment ended with its service up on
          every node (running), or was a dry run (dry-run). Removing never counts
          as success: removed is Done without Succeeded.
        example: false
        type: boolean
      type:
        enum:
        - inference
        - app
        example: inference
        type: string
    type: object
  model.NodeDeploymentReq:
    properties:
      app:
        allOf:
        - $ref: '#/definitions/model.NodeAppReq'
        description: App is required when type is app.
      inference:
        allOf:
        - $ref: '#/definitions/model.NodeInferenceReq'
        description: Inference is required when type is inference.
      targets:
        description: Targets are the nodes to deploy to, at most 32, each once.
        items:
          $ref: '#/definitions/model.NodeDeployTarget'
        type: array
      type:
        description: |-
          Type is "inference" or "app"; the field of the same name below carries
          what to deploy.
        enum:
        - inference
        - app
        example: inference
        type: string
    required:
    - targets
    - type
    type: object
  model.NodeInferenceReq:
    properties:
      args:
        description: |-
          Args are appended to the runtime command after the arguments this
          service sets and the catalog arguments of the artifact
          (runtimes[].args). For vllm they follow `vllm serve --model <ref>
          --port <port>` (and --runner pooling for an embedding model) and the
          catalog arguments, for example ["--max-model-len", "32768"]; vllm takes
          the last value of a repeated flag, so they override the catalog
          arguments. At most 32, each 1 to 256 characters
          without control characters; --model, --port and --host are set by the
          service and refused. Runtime ollama takes none and refuses them.
        example:
        - --max-model-len
        - "32768"
        items:
          type: string
        type: array
      artifactId:
        description: ArtifactID is an artifact of that model.
        example: hf-bf16
        type: string
      env:
        additionalProperties:
          type: string
        description: |-
          Env is added to the runtime container environment and written to the
          .env file beside the compose file. Names match [A-Z_][A-Z0-9_]*;
          values hold no line break and no single quote.
        type: object
      gpu:
        description: |-
          GPU reserves every NVIDIA GPU of the node for the runtime and installs
          the NVIDIA Container Toolkit. Omitted, it is true when the node spec in
          CB-Tumblebug has acceleratorType gpu, and false when the spec cannot be
          read; the node result says which.
        example: false
        type: boolean
      modelId:
        description: ModelID is a model of the model catalog (GET /models).
        example: qwen3-embedding-0.6b
        type: string
      runtimeId:
        description: |-
          RuntimeID is a runtime profile ID (GET /runtimes) the artifact lists.
          Empty takes the first runtime the artifact lists.
        example: vllm
        type: string
    required:
    - artifactId
    - modelId
    type: object
  model.NodeOpenedPort:
    properties:
      port:
        description: Port is the TCP port.
        example: 8000
        type: integer
      protocol:
        description: Protocol is TCP.
        example: TCP
        type: string
      result:
        description: |-
          Result is added when this deployment added the rule, existing when an
          inbound rule of the group already opened the port to 0.0.0.0/0.
        enum:
        - added
        - existing
        example: added
        type: string
      securityGroupId:
        description: |-
          SecurityGroupID is the CB-Tumblebug security group, in the namespace
          of the target.
        example: etri-shared-aws-ap-northeast-2
        type: string
    type: object
  model.NodeProgress:
    properties:
      done:
        description: Done is true once the node is no longer pending, deploying or
          removing.
        example: false
        type: boolean
      error:
        description: Error is why the node failed.
        type: string
      host:
        description: Host is the address the node was reached at (nodes[].node.host).
        example: 203.0.113.10
        type: string
      phase:
        description: |-
          Phase is nodes[].phase of the record: where the node is, or where it
          failed.
        example: compose-up
        type: string
      phaseStartedAt:
        type: string
      ports:
        description: Ports are the TCP ports the deployment serves on the node.
        example:
        - 8000
        items:
          type: integer
        type: array
      serviceUrl:
        description: ServiceURL is the inference API on the node (inference only).
        example: http://203.0.113.10:8000/v1
        type: string
      status:
        description: Status is the node status, as in GET /deployments/{id}.
        example: deploying
        type: string
      step:
        allOf:
        - $ref: '#/definitions/model.NodeDeployStep'
        description: Step is the last playbook started on the node, without its log.
      stepsDone:
        description: |-
          StepsDone counts the playbooks of StepsTotal that succeeded. StepsTotal
          is 2 for a deployment (install-docker, then compose-up or
          copy-and-run), 1 while or after taking it down (compose-down), and 0
          for a dry run.
        example: 1
        type: integer
      stepsTotal:
        example: 2
        type: integer
      target:
        $ref: '#/definitions/model.NodeDeployTarget'
    type: object
  model.NodeProgressCount:
    properties:
      failed:
        description: Failed are failed, interrupted or remove-failed.
        example: 0
        type: integer
      inProgress:
        description: InProgress are pending, deploying or removing.
        example: 1
        type: integer
      succeeded:
        description: Succeeded are running or dry-run, or removed once taken down.
        example: 1
        type: integer
      total:
        example: 2
        type: integer
    type: object
  model.RuntimeCompat:
    properties:
      args:
        description: |-
          Args are arguments the runtime needs for this artifact, such as a
          context length that fits the GPU memory. They are appended after the
          arguments the service sets and before the inference.args of a deploy
          request; vLLM takes the last value when a flag repeats, so the request
          can override them. Only vllm takes them.
        example:
        - --max-model-len
        - "32768"
        items:
          type: string
        type: array
      minVersion:
        description: |-
          MinVersion is the oldest runtime version known to load the artifact.
          Empty means not recorded.
        example: 0.11.0
        type: string
      runtimeId:
        description: RuntimeID is the runtime profile ID, as listed by GET /runtimes.
        example: vllm
        type: string
      verifiedAt:
        description: |-
          VerifiedAt is when an inference deployment of this artifact on this
          runtime last succeeded on a node. A dry run does not count. Absent means
          never verified. Filter with ?verified=.
        example: "2026-11-04T03:00:00Z"
        type: string
    required:
    - runtimeId
    type: object
  model.RuntimeProfile:
    properties:
      apiBasePath:
        description: |-
          APIBasePath is the path of the OpenAI compatible API, appended to
          http://<node>:<port> by whoever calls the inference service.
        example: /v1
        type: string
      formats:
        description: Formats are the artifact formats this runtime loads.
        example:
        - hf
        items:
          type: string
        type: array
      healthPath:
        description: HealthPath answers 200 once the runtime is up.
        example: /health
        type: string
      id:
        description: ID is the runtime identifier artifacts refer to in runtimes[].runtimeId.
        example: vllm
        type: string
      image:
        description: Image is the container image, pinned to a release tag.
        example: vllm/vllm-openai:v0.32.0
        type: string
      port:
        description: |-
          Port is the TCP port the runtime serves its API on, inside the container
          and on the node.
        example: 8000
        type: integer
    required:
    - formats
    - id
    - image
    - port
    type: object
  model.RuntimeProfileListResp:
    properties:
      runtimes:
        items:
          $ref: '#/definitions/model.RuntimeProfile'
        type: array
    type: object
  model.SemaphoreStatus:
    properties:
      authenticated:
        description: |-
          Authenticated is whether the configured token, or user name and
          password, were accepted.
        example: true
        type: boolean
      configured:
        description: Configured is false when AIAPP_SEMAPHORE_URL is not set.
        example: true
        type: boolean
      latencyMs:
        description: |-
          LatencyMs is how long the reachability call took, in milliseconds.
          Absent when it did not answer.
        example: 3
        type: integer
      message:
        description: Message says what was found, or why a check failed.
        example: CB-Tumblebug is ready
        type: string
      project:
        description: |-
          Project is the Semaphore project deployments are registered in
          (AIAPP_SEMAPHORE_PROJECT).
        example: aiapp
        type: string
      projectId:
        description: |-
          ProjectID is the project's ID. Absent when it does not exist yet or
          could not be read.
        example: 1
        type: integer
      reachable:
        description: Reachable is whether it answered.
        example: true
        type: boolean
      templates:
        description: |-
          Templates are the templates of the deployment playbooks, each with
          whether it exists. Every one reads as missing when the project could
          not be read.
        items:
          $ref: '#/definitions/model.SemaphoreTemplateStatus'
        type: array
      uiUrl:
        description: |-
          UIURL is the web UI the task links of deployment records point at
          (AIAPP_SEMAPHORE_UI_URL). Absent when it is not set, and then the
          records carry no task links.
        example: http://203.0.113.5:3001
        type: string
      url:
        description: URL is where it is called, without credentials.
        example: http://cb-tumblebug:1323/tumblebug
        type: string
      version:
        description: Version is the version it reports, when it reports one.
        example: v2.12.17-5767d93-1741607759
        type: string
    type: object
  model.SemaphoreTemplateStatus:
    properties:
      exists:
        description: Exists is false until the first deployment that runs the playbook.
        example: true
        type: boolean
      id:
        description: ID is the template's ID. Absent when it does not exist.
        example: 3
        type: integer
      name:
        example: aiapp-compose-up
        type: string
      playbook:
        example: compose-up.yml
        type: string
    type: object
  model.ServiceStatus:
    properties:
      checkedAt:
        description: CheckedAt is when the checks ran.
        example: "2026-11-03T12:00:00Z"
        type: string
      dryRun:
        description: |-
          DryRun is true when deployments stop after placing their files and
          node control is blocked (AIAPP_TUMBLEBUG_DRY_RUN). Semaphore is not
          called then.
        example: false
        type: boolean
      openPorts:
        description: |-
          OpenPorts is true when a deployment opens the ports it serves in the
          node's CB-Tumblebug security groups (AIAPP_DEPLOYMENT_OPEN_PORTS).
        example: true
        type: boolean
      semaphore:
        allOf:
        - $ref: '#/definitions/model.SemaphoreStatus'
        description: Semaphore runs the deployment playbooks.
      stage:
        allOf:
        - $ref: '#/definitions/model.StageStatus'
        description: Stage is the folder deployment files are placed in for Semaphore.
      tumblebug:
        allOf:
        - $ref: '#/definitions/model.DependencyStatus'
        description: Tumblebug is the CB-Tumblebug the nodes are read from.
    type: object
  model.SimpleMsg:
    properties:
      message:
        example: AI application not found
        type: string
    type: object
  model.StageStatus:
    properties:
      message:
        description: Message says what was found.
        example: writable
        type: string
      path:
        description: Path is AIAPP_STAGE_ROOT.
        example: /var/lib/aiapp/stage
        type: string
      writable:
        description: Writable is whether a file could be created in it.
        example: true
        type: boolean
    type: object
  model.TokenUsage:
    properties:
      inputTokens:
        type: integer
      outputTokens:
        type: integer
    type: object
  model.ToolDescriptor:
    properties:
      description:
        type: string
      grade:
        description: Grade is one of read, review, write, destructive.
        type: string
      guardedByDryRun:
        description: GuardedByDryRun is true when the dry-run setting can block this
          tool.
        type: boolean
      inputSchema: {}
      name:
        type: string
    type: object
  model.ToolListResp:
    properties:
      dryRun:
        type: boolean
      tools:
        items:
          $ref: '#/definitions/model.ToolDescriptor'
        type: array
    type: object
  model.ToolStep:
    properties:
      calledAt:
        type: string
      duration:
        type: string
      error:
        type: string
      executed:
        description: Executed is false when the dry-run guard blocked an infrastructure
          change.
        type: boolean
      grade:
        description: Grade is the tool risk grade that decided whether the call was
          executed.
        type: string
      index:
        type: integer
      input: {}
      output: {}
      tool:
        type: string
    type: object
  modelcat.SyncCounts:
    properties:
      added:
        description: Added is how many fetched models were new to the catalog.
        example: 12
        type: integer
      invalid:
        description: |-
          Invalid is how many fetched models were dropped because they do not
          validate or repeat an ID earlier in the same fetch.
        example: 0
        type: integer
      skipped:
        description: |-
          Skipped is how many fetched models were left alone because the catalog
          holds an entry of the same ID from another origin.
        example: 1
        type: integer
      staled:
        description: |-
          Staled is how many entries of the origin the fetch did not return. Each
          is marked stale, whether or not it already was.
        example: 3
        type: integer
      updated:
        description: Updated is how many entries of the origin were replaced from
          the fetch.
        example: 80
        type: integer
    type: object
  recommend.AppCandidate:
    properties:
      name:
        description: Name is an uploaded application (GET /apps).
        example: open-webui
        type: string
      reason:
        description: Reason says, for a person, why the candidate was picked.
        example: Chat interface that talks to an OpenAI compatible API
        type: string
      score:
        description: |-
          Score ranks the candidate: higher is better. The scale is the
          recommender's own.
        example: 0.74
        type: number
      version:
        description: Version is a version of that application.
        example: 1
        type: integer
    required:
    - name
    - version
    type: object
  recommend.AppRecommendReq:
    properties:
      gpuCount:
        description: |-
          GPUCount is the number of GPUs available on one node. 0 means no GPU;
          absent means unknown. At most 64.
        example: 1
        type: integer
      gpuMemoryGiB:
        description: GPUMemoryGiB is the memory of one GPU in GiB (2^30 bytes).
        example: 24
        type: number
      inference:
        description: |-
          Inference are the inference services the application is to use, each
          naming a model of the catalog.
        items:
          $ref: '#/definitions/recommend.InferenceRef'
        type: array
      maxCandidates:
        description: |-
          MaxCandidates bounds the candidates returned, at most 50. 0 leaves it to
          the recommender.
        example: 3
        type: integer
      maxSizeGiB:
        description: |-
          MaxSizeGiB is the largest download, in GiB, the caller accepts for one
          model artifact or application.
        example: 20
        type: number
      requirements:
        additionalProperties: {}
        description: |-
          Requirements carry anything else the recommender reads. The keys are the
          recommender's own; the service passes them through unread.
        type: object
      targetNodes:
        description: TargetNodes are the nodes the application is meant to run on,
          at most 32.
        items:
          $ref: '#/definitions/recommend.TargetNode'
        type: array
      tasks:
        description: |-
          Tasks are what the application is to be used for, such as chat-ui, rag
          or travel-planner. Uploaded applications carry no tags, so the words are
          the recommender's own.
        example:
        - chat-ui
        items:
          type: string
        type: array
    type: object
  recommend.AppRecommendResp:
    properties:
      candidates:
        description: |-
          Candidates are ordered best first. Empty means no uploaded application
          fits.
        items:
          $ref: '#/definitions/recommend.AppCandidate'
        type: array
      recommender:
        description: |-
          Recommender is the name of the implementation that answered, as set in
          AIAPP_RECOMMENDER_APP.
        example: khu
        type: string
    type: object
  recommend.InferenceRef:
    properties:
      artifactId:
        description: ArtifactID is an artifact of that model. Empty means any.
        example: hf-bf16
        type: string
      modelId:
        description: ModelID is a model of the model catalog (GET /models).
        example: qwen3-vl-8b
        type: string
      runtimeId:
        description: RuntimeID is the runtime profile that serves it. Empty means
          any.
        example: vllm
        type: string
    required:
    - modelId
    type: object
  recommend.ModelCandidate:
    properties:
      artifactId:
        description: ArtifactID is an artifact of that model.
        example: hf-bf16
        type: string
      modelId:
        description: ModelID is a model of the model catalog (GET /models).
        example: qwen3-vl-8b
        type: string
      reason:
        description: Reason says, for a person, why the candidate was picked.
        example: Accepts text and image input and fits one 24 GiB GPU in BF16
        type: string
      runtimeId:
        description: RuntimeID is a runtime profile the artifact lists.
        example: vllm
        type: string
      score:
        description: |-
          Score ranks the candidate: higher is better. The scale is the
          recommender's own.
        example: 0.82
        type: number
    required:
    - artifactId
    - modelId
    - runtimeId
    type: object
  recommend.ModelRecommendReq:
    properties:
      gpuCount:
        description: |-
          GPUCount is the number of GPUs available on one node. 0 means no GPU;
          absent means unknown. At most 64.
        example: 1
        type: integer
      gpuMemoryGiB:
        description: GPUMemoryGiB is the memory of one GPU in GiB (2^30 bytes).
        example: 24
        type: number
      inputModalities:
        description: |-
          InputModalities are the kinds of input the model must accept, in the
          words of the catalog inputModalities[]: text or image.
        example:
        - text
        - image
        items:
          type: string
        type: array
      maxCandidates:
        description: |-
          MaxCandidates bounds the candidates returned, at most 50. 0 leaves it to
          the recommender.
        example: 3
        type: integer
      maxSizeGiB:
        description: |-
          MaxSizeGiB is the largest download, in GiB, the caller accepts for one
          model artifact or application.
        example: 20
        type: number
      requirements:
        additionalProperties: {}
        description: |-
          Requirements carry anything else the recommender reads, such as a cost
          budget, a latency target or a language. The keys are the recommender's
          own; the service passes them through unread.
        type: object
      runtimeId:
        description: |-
          RuntimeID is the runtime profile the caller prefers, as listed by
          GET /runtimes. It must name an existing profile.
        example: vllm
        type: string
      targetNodes:
        description: TargetNodes are the nodes the model is meant to run on, at most
          32.
        items:
          $ref: '#/definitions/recommend.TargetNode'
        type: array
      tasks:
        description: |-
          Tasks are what the model is to be used for, in the words of the catalog
          tasks[]: chat, vision-chat or embedding.
        example:
        - vision-chat
        items:
          type: string
        type: array
    type: object
  recommend.ModelRecommendResp:
    properties:
      candidates:
        description: |-
          Candidates are ordered best first. Empty means nothing in the catalog
          fits.
        items:
          $ref: '#/definitions/recommend.ModelCandidate'
        type: array
      recommender:
        description: |-
          Recommender is the name of the implementation that answered, as set in
          AIAPP_RECOMMENDER_MODEL.
        example: khu
        type: string
    type: object
  recommend.TargetNode:
    properties:
      infraId:
        description: InfraID is the CB-Tumblebug Infra the node belongs to.
        example: travel
        type: string
      nodeId:
        description: NodeID is the node within the Infra. It needs infraId.
        example: vm1
        type: string
      nsId:
        description: NsID is the CB-Tumblebug namespace of the Infra.
        example: etri
        type: string
    required:
    - nsId
    type: object
info:
  contact: {}
  description: Keeps an AI model catalog (models, the artifacts each is published
    as, and the inference runtime profiles they run on), registers AI applications
    as a name, files and a script with versions, deploys an inference service or an
    application onto nodes CB-Tumblebug already runs through Semaphore, publishes
    the same capabilities as MCP tools and archives every deploy and control call.
    Automation engine routes and the partner natural language agent routes are forwarded
    to their own processes.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: AI-MCMP AI-App Service (Prototype)
  version: 0.1.0
paths:
  /apps:
    get:
      description: 'List every uploaded AI application, ordered by name, with every
        version: its number, script, files (name, size and SHA-256), the ports it
        serves and upload time. Versions are listed oldest first.'
      operationId: GetAllApps
      produces:
      - application/json
      responses:
        "200":
          description: AI application list
          schema:
            $ref: '#/definitions/model.AppListResp'
      security:
      - BearerAuth: []
      summary: List AI applications
      tags:
      - '[App] AI Applications'
    post:
      consumes:
      - multipart/form-data
      description: 'Upload the files of an AI application and the script that deploys
        it, as one multipart/form-data body. Uploading again under a registered name
        adds the next version (the highest version plus one); earlier versions are
        kept. A node receiving a version gets every file in one folder and runs the
        script from that folder; the target node and the addresses of other nodes
        are given by the deployment request, not here. File names are the filename
        of each files part, used as is: one name of letters, digits, ".", "_", "+"
        and "-", not starting with "." (.env is written by the deployment request),
        at most 255 characters, each name once. A name with a path such as ../x or
        conf/x is refused, not shortened. The script is at most 64 KiB, at most 256
        files are accepted, and the script and files together may not exceed the upload
        bound of the service (AIAPP_APP_UPLOAD_MAX_BYTES, 256 MiB by default).'
      operationId: PostApp
      parameters:
      - default: open-webui
        description: 'Application name: lower case letters, digits, underscore and
          hyphen, starting with a letter or digit, at most 63 characters. No dot:
          the name becomes part of a docker compose project name on the node'
        in: formData
        name: name
        required: true
        type: string
      - description: Deployment script. Send it as this text field or as a file part
          named script (with a filename), exactly once
        in: formData
        name: script
        required: true
        type: string
      - description: Files the script uses, such as docker-compose.yml. Repeat the
          part for each file
        in: formData
        name: files
        type: file
      - default: "3000"
        description: TCP ports the application serves on the node, comma separated
          or one per repeated field, each from 1 to 65535, at most 16. A deployment
          opens them inbound from 0.0.0.0/0 in every CB-Tumblebug security group of
          the node; empty opens nothing
        in: formData
        name: ports
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: The version registered, with the size and SHA-256 of every
            file
          schema:
            $ref: '#/definitions/model.AppVersion'
        "400":
          description: Not multipart, name or script missing, script given twice,
            a file name not allowed, or a port not a number from 1 to 65535
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "413":
          description: The script and files exceed the upload bound
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: The upload could not be written to the store
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Upload an AI application
      tags:
      - '[App] AI Applications'
  /apps/{name}:
    delete:
      description: Remove an AI application with every version and its stored files.
        Applications already deployed on nodes are untouched
      operationId: DeleteApp
      parameters:
      - description: Application name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: AI application deleted
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "404":
          description: AI application not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: The stored files could not be removed
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Delete an AI application
      tags:
      - '[App] AI Applications'
    get:
      description: Read one AI application with every version, oldest first
      operationId: GetApp
      parameters:
      - default: open-webui
        description: Application name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: AI application
          schema:
            $ref: '#/definitions/model.App'
        "404":
          description: AI application not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Get an AI application
      tags:
      - '[App] AI Applications'
  /apps/{name}/versions/{version}:
    get:
      description: 'Read one version of an AI application: its script, the name, size
        and SHA-256 of every file, and the ports it serves'
      operationId: GetAppVersion
      parameters:
      - default: open-webui
        description: Application name
        in: path
        name: name
        required: true
        type: string
      - default: 1
        description: Version number, from 1
        in: path
        name: version
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: AI application version
          schema:
            $ref: '#/definitions/model.AppVersion'
        "400":
          description: version is not a positive integer
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "404":
          description: AI application or version not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Get one version of an AI application
      tags:
      - '[App] AI Applications'
  /archive:
    get:
      description: List archived deployment and control runs, newest first. A record
        holds the instruction, every tool call with its arguments and the guard verdict
      operationId: GetArchive
      parameters:
      - default: 20
        description: How many records to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Archived runs
          schema:
            $ref: '#/definitions/model.ArchiveListResp'
        "400":
          description: Malformed limit
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: Archive lookup failed
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: List archived runs
      tags:
      - '[Archive] Deploy and Control Archive'
  /archive/{runId}:
    get:
      description: Read one archived run by its identifier
      operationId: GetArchiveRun
      parameters:
      - description: Run ID
        in: path
        name: runId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Archived run
          schema:
            $ref: '#/definitions/model.ArchiveRecord'
        "404":
          description: Run not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: Archive lookup failed
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Get one archived run
      tags:
      - '[Archive] Deploy and Control Archive'
  /deployments:
    get:
      description: List the deployments made through POST /deployments, newest first,
        with the status of every node. Each filter is optional and matched exactly;
        all given filters must match. nsId matches a deployment when any of its targets
        is in that namespace. Task output is left out; read it with GET /deployments/{id}/logs.
        Records are kept in AIAPP_DEPLOYMENT_STORE_FILE when it is set, and in memory
        otherwise.
      operationId: GetAllNodeDeployments
      parameters:
      - description: Deployment type
        enum:
        - inference
        - app
        in: query
        name: type
        type: string
      - description: CB-Tumblebug namespace of any target
        in: query
        name: nsId
        type: string
      - description: Deployment status
        enum:
        - pending
        - deploying
        - running
        - failed
        - partial
        - dry-run
        - interrupted
        - removing
        - removed
        - remove-failed
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deployments, newest first
          schema:
            $ref: '#/definitions/model.NodeDeploymentListResp'
      security:
      - BearerAuth: []
      summary: List deployments onto nodes
      tags:
      - '[Deployment] Node Deployment'
    post:
      consumes:
      - application/json
      description: |-
        Deploy an inference service or an uploaded AI application onto nodes CB-Tumblebug already runs. This service does not create VMs.

        type inference needs inference: modelId and artifactId from GET /models, and optionally runtimeId (a runtime profile from GET /runtimes the artifact lists; defaults to its first), gpu and args (extra runtime arguments appended after the ones the service sets and the catalog args of the artifact, runtimes[].args, which a repeated flag here overrides for vllm, such as ["--max-model-len","32768"] for vllm; at most 32, each 1 to 256 characters without control characters, never --model, --port or --host; ollama refuses them). A docker-compose.yml is rendered from the artifact and the runtime profile (preview it with GET /models/{modelId}/artifacts/{artifactId}/compose). type app needs app: name and version (0 takes the latest) from GET /apps. Both take env, written to a .env file next to the deployed files; names match [A-Z_][A-Z0-9_]*, values hold no line break and no single quote.

        Each target is {kind: node, nsId, infraId, nodeId, sshUser}. The cloud, region, zone, address, SSH user and SSH key are read from the node in CB-Tumblebug (public IP, or private IP when there is none). sshUser is optional (1 to 32 characters matching [a-z_][a-z0-9_-]*) and replaces the SSH user CB-Tumblebug reports (nodeUserName) in the Semaphore inventory, while the key stays the one CB-Tumblebug holds. Without sshUser, before the playbooks of a node run, the service logs in to the node over SSH with that key (authentication only, no command, 10 seconds per attempt, at most 6 attempts) as the CB-Tumblebug user and keeps it when the node accepts it. CB-Tumblebug creates its login user cb-user with useradd -G sudo, which fails on images without a sudo group (RHEL, Rocky, AlmaLinux and Amazon Linux use wheel), and such a node has no cb-user, while the image default user accepts the same key. So when the node refuses the CB-Tumblebug user, the default users of the node image (from its osType: ec2-user for Amazon Linux, RHEL and SUSE, rocky, almalinux then ec2-user, centos, fedora, opc then ec2-user for Oracle Linux, admin for Debian, ubuntu; ec2-user, ubuntu and admin for an OS not recognized; never root) are tried in order and the first accepted is used, with a note naming both users. When every user is refused, or the node cannot be reached yet (still booting), the CB-Tumblebug user is kept and a note says so; install-docker then waits for the node as before. nodes[].sshUser and nodes[].steps[].sshUser record the user the playbooks ran as, and nodes[].sshUserSource where it came from (request, tumblebug or fallback). kind k8s is reserved and answered with 422. When gpu is omitted it is taken from the node spec (acceleratorType gpu); a spec that cannot be read means no GPU, and nodes[].notes says why.

        For every node, in parallel up to a bound: the files are placed in <AIAPP_STAGE_ROOT>/<id>/<csp>-<nodeId>/, then Semaphore runs install-docker (with the NVIDIA Container Toolkit on a GPU node) and then compose-up (inference, which waits for the runtime health path from the node itself and, when the node uses the GPU, checks that the runtime runs on it: a vllm process in nvidia-smi, or an ollama log line of inference compute on CUDA or ROCm; the line found is kept in nodes[].gpuCheck) or copy-and-run (app, which runs the app script from the folder the files are copied to, then waits until every app port answers HTTP and fails the node when a container of the project restarted or exited with a non-zero code). On the node the files go to /opt/aiapp/<work key> and run as compose project aiapp-<work key>, where the work key is ms-<runtimeId> for an inference service and app-<name> for an app; nodes[].workKey and nodes[].nodeDir record them. Deploying the same work key to a node again replaces the previous deployment there. The SSH key is registered in Semaphore for the run only and deleted afterwards; it is never part of a record, a log or a response.

        Once the playbooks of a node succeed, the ports the deployment serves (nodes[].ports: the runtime port of an inference service; for an app, app.ports or else the ports the app version was uploaded with) are opened over TCP inbound from 0.0.0.0/0 in every CB-Tumblebug security group the node lists (securityGroupIds). Ports a group already lets in are not sent again. nodes[].openedPorts lists, per group and port, whether the rule was added or already there. A port that cannot be opened does not fail the node: nodes[].portsError says why and a note points to it. AIAPP_DEPLOYMENT_OPEN_PORTS=false (true by default) turns port opening off; the ports are then only recorded, with a note. A dry run opens nothing; nodes[].ports still lists the ports it would open.

        The request is checked against the catalogs first: a malformed request is 400, an unknown model, artifact, runtime or app is 404, and an artifact the runtime cannot run is 422. Every target node is then read from CB-Tumblebug: a node or infra CB-Tumblebug does not have is 404 naming the target nsId/infraId/nodeId, and CB-Tumblebug failing or not answering is 502. A refused request leaves no record. An accepted request answers 202 with the record in status pending; follow it with GET /deployments/{id}/progress until done is true (or GET /deployments/{id} for the whole record). With dry run on (AIAPP_TUMBLEBUG_DRY_RUN), only the node look-up and the file placement are done, nothing is registered in Semaphore, and the finished record (status dry-run, with the rendered compose and the node addresses) is returned with 200.
      operationId: PostNodeDeployment
      parameters:
      - description: What to deploy and where
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.NodeDeploymentReq'
      produces:
      - application/json
      responses:
        "200":
          description: 'Dry run: the files were placed and nothing was run'
          schema:
            $ref: '#/definitions/model.NodeDeployment'
        "202":
          description: Accepted; the deployment goes on in the background
          schema:
            $ref: '#/definitions/model.NodeDeployment'
        "400":
          description: Malformed request
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "404":
          description: Model, artifact, runtime profile, application or target node
            not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "422":
          description: A k8s target, or an artifact the runtime cannot run
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: The record could not be written
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "502":
          description: CB-Tumblebug failed or did not answer while the target nodes
            were read
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Deploy onto existing nodes
      tags:
      - '[Deployment] Node Deployment'
  /deployments/{id}:
    delete:
      description: |-
        Stop and remove the containers of a deployment on every node: Semaphore runs compose-down, which is docker compose -p aiapp-<work key> down --remove-orphans, as the SSH user the node was deployed as (nodes[].sshUser, which is targets[].sshUser when the request gave it, or the image default user the deployment fell back to); no SSH login is tried again. Named volumes (for example model weights a runtime downloaded) and the node folder /opt/aiapp/<work key> are kept, so that the next deployment of the work key finds them. A node without the project has nothing to take down and succeeds. The ports the deployment opened (nodes[].openedPorts) stay open in the CB-Tumblebug security groups, since other workloads may share them; close them in CB-Tumblebug when needed.

        Only the latest deployment of a work key on a node is live there. A node where a later deployment of the same work key replaced this one is not touched, since stopping the project would stop the later deployment; it is marked removed and nodes[].notes names the later deployment. A node of a dry-run deployment, a node where the deployment never started its service (compose-up or copy-and-run never ran), and a node CB-Tumblebug no longer has are marked removed without running anything, each with a note.

        When some node needs compose-down, the answer is 202 with the record in status removing and nodes[].status removing; follow it with GET /deployments/{id} until it is removed (every node) or remove-failed (compose-down failed on some node; nodes[].error says why). DELETE again retries the nodes not removed yet. When no node needs compose-down, the finished record (status removed) is returned with 200. A deployment already removed is returned as it is with 200. With dry run on (AIAPP_TUMBLEBUG_DRY_RUN), nothing is sent to Semaphore: nodes that would be taken down keep their status and get a note, and the record is returned with 200. Every removal is archived (kind node-removal).
      operationId: DeleteNodeDeployment
      parameters:
      - description: Deployment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Nothing to run on any node, already removed, or dry run
          schema:
            $ref: '#/definitions/model.NodeDeployment'
        "202":
          description: Accepted; the nodes are taken down in the background
          schema:
            $ref: '#/definitions/model.NodeDeployment'
        "404":
          description: Deployment not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "409":
          description: The deployment is still pending or deploying, or is being taken
            down
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Take a deployment down from its nodes
      tags:
      - '[Deployment] Node Deployment'
    get:
      description: 'Read one deployment: its status (pending, deploying, running,
        failed, partial, dry-run, interrupted; removing, removed or remove-failed
        once taken down with DELETE /deployments/{id}), and for every node its status,
        how it was reached (csp, region, zone, host, port, user, specId; never the
        key), whether it got the GPU and why, the stage folder, the rendered compose
        and service URL of an inference service, its phase (what the service is doing
        there, as in GET /deployments/{id}/progress), and every playbook run with
        its Semaphore task ID and status (set when the task starts and followed while
        it runs) and the Ansible task it is on (currentTask). For polling, GET /deployments/{id}/progress
        answers the same progress in a shorter body. Task output is left out; read
        it with GET /deployments/{id}/logs.'
      operationId: GetNodeDeployment
      parameters:
      - description: Deployment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deployment record
          schema:
            $ref: '#/definitions/model.NodeDeployment'
        "404":
          description: Deployment not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Get a deployment onto nodes
      tags:
      - '[Deployment] Node Deployment'
  /deployments/{id}/control:
    post:
      consumes:
      - application/json
      description: Apply a CB-Tumblebug lifecycle action (suspend, resume, reboot
        or terminate) to every node of a deployment, one call per node. A node CB-Tumblebug
        refuses is reported failed and the others still get the action. Nothing is
        sent, and every node is reported blocked, when dry run is on or the deployment
        was a dry run. Every call is archived (kind node-control).
      operationId: PostNodeDeploymentControl
      parameters:
      - description: Deployment ID
        in: path
        name: id
        required: true
        type: string
      - description: Lifecycle action
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.NodeControlReq'
      produces:
      - application/json
      responses:
        "200":
          description: Per node result
          schema:
            $ref: '#/definitions/model.NodeControlResp'
        "400":
          description: Unknown action
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "404":
          description: Deployment not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Control the nodes of a deployment
      tags:
      - '[Deployment] Node Deployment'
  /deployments/{id}/logs:
    get:
      description: Read the Semaphore task log of every playbook run on every node
        of a deployment, one line per entry with colour codes removed. While a task
        runs, its output is the log so far, read from Semaphore every 5 seconds; once
        it ends, the whole log. The tasks and their logs are also kept in Semaphore
        under the template of each playbook.
      operationId: GetNodeDeploymentLogs
      parameters:
      - description: Deployment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Task output per node and step
          schema:
            $ref: '#/definitions/model.NodeDeploymentLogs'
        "404":
          description: Deployment not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Get the task output of a deployment
      tags:
      - '[Deployment] Node Deployment'
  /deployments/{id}/progress:
    get:
      description: |-
        Read the short progress of a deployment of either type (inference or app), made to be polled every few seconds after POST /deployments answers 202, and after DELETE /deployments/{id} answers 202, until done is true. It is computed from the deployment record and asks no node and no other service.

        done is false while the deployment is pending, deploying or removing, and true otherwise. succeeded is true only when it ended running (the service is up on every node) or dry-run. A finished deployment that is not succeeded is failed, partial (count.succeeded and count.failed tell how many nodes), interrupted (the service restarted while it ran), or removed or remove-failed once taken down.

        For every node: status, done, phase (reading-node, staging, checking-ssh, waiting-node-lock, install-docker, compose-up, copy-and-run, compose-down, opening-ports, done; a failed node keeps the phase it failed in) with phaseStartedAt, the last playbook started (step: playbook, Semaphore taskId and taskUrl as soon as the task starts, its status waiting, starting or running while it runs and success, error, stopped or rejected once it ended, and currentTask, the Ansible task it is on, such as "Wait until the service answers"), stepsDone of stepsTotal, error, host, serviceUrl and ports. The task status and currentTask are read from Semaphore every 5 seconds while the playbook runs.
      operationId: GetNodeDeploymentProgress
      parameters:
      - description: Deployment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Progress of the deployment
          schema:
            $ref: '#/definitions/model.NodeDeploymentProgress'
        "404":
          description: Deployment not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Get the progress of a deployment
      tags:
      - '[Deployment] Node Deployment'
  /endpoints:
    get:
      description: |-
        List the addresses of what serves on the nodes now, derived from the deployment records of POST /deployments: one endpoint per node and work key (ms-<runtimeId> for an inference service, app-<name> for an app). Each filter is optional and matched exactly; all given filters must match. Endpoints are ordered by nsId, infraId, nodeId and workKey.

        On a node, a work key is decided by the latest deployment of it there (by creation time) that is pending or deploying, that started its service (compose-up or copy-and-run ran), or that was taken down after starting it. It has an endpoint only when that deployment is running on the node. So a redeploy replaces the endpoint with the new deploymentId; DELETE /deployments/{id} removes it, and an older deployment of the same work key does not come back, since compose-down stopped the project they share; a later deployment that failed after it started its service leaves no endpoint, since the shared project was recreated and the older containers are gone; a later deployment that failed before that (for example in install-docker) leaves the older endpoint as it was; one still pending or deploying leaves none until it ends. Dry-run deployments never make an endpoint.

        An inference endpoint carries runtimeId, modelId, artifactId, url (the OpenAI compatible API, http://<host>:<port><apiBasePath>) and healthUrl. An app endpoint carries name, version and urls, one http://<host>:<port> per port it serves. host is the public IP of the node, or its private IP when it has none. portsOpened is true when every served port was found or added in a CB-Tumblebug security group of the node; otherwise the URLs may not be reachable from outside, and portsError or notes say why.
      operationId: GetAllEndpoints
      parameters:
      - description: CB-Tumblebug namespace of the node
        in: query
        name: nsId
        type: string
      - description: Endpoint type
        enum:
        - inference
        - app
        in: query
        name: type
        type: string
      - description: CB-Tumblebug Infra of the node
        in: query
        name: infraId
        type: string
      - description: Node within the Infra
        in: query
        name: nodeId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Endpoints serving now
          schema:
            $ref: '#/definitions/model.EndpointListResp'
      security:
      - BearerAuth: []
      summary: List the inference services and applications serving now
      tags:
      - '[Deployment] Endpoints'
  /engine/card:
    get:
      description: 'Report the engine card an agent registry reads: identity, that
        it uses no LLM, its workflows, the AI-App MCP server it calls and whether
        it is connected, the tools it publishes and the ones it calls, the dry-run
        state and how registration went'
      operationId: GetEngineCard
      produces:
      - application/json
      responses:
        "200":
          description: Engine card
          schema:
            $ref: '#/definitions/engine.Card'
        "502":
          description: Automation engine is not reachable from the AI-App service
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Describe the automation engine
      tags:
      - '[Engine] AI Application Automation Engine'
  /engine/runs:
    get:
      description: List archived engine runs, newest first, each with every step,
        its input and result, and whether the dry-run gate held it
      operationId: GetEngineRuns
      parameters:
      - default: 20
        description: How many runs to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Archived runs
          schema:
            $ref: '#/definitions/engine.RunListResp'
        "400":
          description: Malformed limit
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: Archive lookup failed
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: List automation engine runs
      tags:
      - '[Engine] AI Application Automation Engine'
  /engine/runs/{runId}:
    get:
      description: Read one archived engine run by its identifier
      operationId: GetEngineRun
      parameters:
      - description: Run ID
        in: path
        name: runId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Archived run
          schema:
            $ref: '#/definitions/engine.Run'
        "404":
          description: Run not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: Archive lookup failed
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Get one automation engine run
      tags:
      - '[Engine] AI Application Automation Engine'
  /engine/workflows/{workflow}:
    post:
      consumes:
      - application/json
      description: |-
        Run one fixed workflow as ordered AI-App tool calls, without a model, and archive the run.
        deploy takes the node deployment request of POST /deployments (model.NodeDeploymentReq: {type, targets, inference | app}); it reads the model (get_model) or the application (get_app), creates the deployment (create_deployment) and reads it (get_deployment) until every node ended. An inference service is checked to answer by the compose-up playbook inside the deployment. A deployment that succeeded on some nodes only (partial) fails the run.
        heal takes {deploymentId}; a deployment that is failed, partial, interrupted or a dry run is created once more from the request it was made with, and followed the same way. A deployment running on every node is left alone, a pending or deploying one is refused.
        control takes {deploymentId, action} with action suspend, resume, reboot or terminate (control_node).
        status takes {deploymentId} and reports the deployment record and the last task output lines of every node (get_deployment, get_deployment_logs).
        A step held by the AI-App dry-run gate is reported as blocked and the steps that need it as waiting. A run whose steps failed is still returned with 200 and status failed. Served by the automation engine and forwarded by the AI-App service
      operationId: PostEngineWorkflow
      parameters:
      - description: Workflow
        enum:
        - deploy
        - heal
        - control
        - status
        in: path
        name: workflow
        required: true
        type: string
      - default: default
        description: Namespace ID
        in: query
        name: ns
        type: string
      - description: 'Workflow input: model.NodeDeploymentReq for deploy, {deploymentId}
          for heal and status, {deploymentId, action} for control'
        in: body
        name: input
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Run finished; see its status
          schema:
            $ref: '#/definitions/engine.Run'
        "400":
          description: Malformed or incomplete input
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "404":
          description: Unknown workflow
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "502":
          description: Automation engine is not reachable from the AI-App service
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "503":
          description: AI-App tool server is not reachable
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Run an automation engine workflow
      tags:
      - '[Engine] AI Application Automation Engine'
  /models:
    get:
      description: 'List the AI models in the model catalog with every artifact each
        is published as. Each filter is optional and compared without regard to case;
        all given filters must match. task, modality and origin match the model; verified=true
        keeps the models for which some artifact has some runtime with verifiedAt
        set, verified=false the others. format, runtimeId and source match an artifact,
        and a model is listed only when one of its artifacts matches all three of
        them at once. Values are returned as the source states them: an absent contextLength,
        sizeGiB or precision means unknown, not zero. Sizing nodes from these values
        is left to the caller.'
      operationId: GetAllModels
      parameters:
      - description: Model task, such as chat, vision-chat or embedding
        in: query
        name: task
        type: string
      - description: Input modality the model accepts, such as text or image
        in: query
        name: modality
        type: string
      - description: 'Artifact file format: hf (Hugging Face safetensors) or gguf'
        in: query
        name: format
        type: string
      - description: Runtime profile ID an artifact runs on, as listed by GET /runtimes
        in: query
        name: runtimeId
        type: string
      - description: Artifact source, such as huggingface or ollama
        in: query
        name: source
        type: string
      - description: Who put the model in the catalog. An absent origin is read as
          manual
        enum:
        - seed
        - manual
        - huggingface
        - ollama
        - docker-model-runner
        - ngc
        - kaggle
        in: query
        name: origin
        type: string
      - description: 'true: an inference deployment of some artifact succeeded on
          some runtime (runtimes[].verifiedAt set); false: none did'
        in: query
        name: verified
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: AI model list, ordered by id
          schema:
            $ref: '#/definitions/model.ModelListResp'
        "400":
          description: origin is not a known origin, or verified is not a boolean
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: List AI models
      tags:
      - '[Model] AI Model Catalog'
    post:
      consumes:
      - application/json
      description: 'Register an AI model, or replace the model of the same id with
        this record. A model needs an id, a name and at least one artifact; each artifact
        needs an id unique within the model, a source, a ref and a format. runtimes[]
        lists the compatible runtimes; an artifact with none is listed but refused
        with 422 when deployed. The model is recorded with origin manual, stale false
        and no syncedAt whatever the body says; runtimes[].verifiedAt is kept as given:
        the catalog sync leaves a model registered or edited here alone. Runtimes
        are not checked against the runtime profiles here; a pairing that does not
        fit is refused when a compose file is rendered for it.'
      operationId: PostModel
      parameters:
      - description: AI model metadata
        in: body
        name: model
        required: true
        schema:
          $ref: '#/definitions/model.Model'
      produces:
      - application/json
      responses:
        "200":
          description: AI model registered
          schema:
            $ref: '#/definitions/model.Model'
        "400":
          description: Malformed or incomplete metadata
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: The catalog file could not be written
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Register an AI model
      tags:
      - '[Model] AI Model Catalog'
  /models/{modelId}:
    delete:
      description: Remove an AI model from the catalog. Inference services already
        running are untouched
      operationId: DeleteModel
      parameters:
      - description: AI model ID
        in: path
        name: modelId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: AI model deleted
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "404":
          description: AI model not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: The catalog file could not be written
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Delete an AI model
      tags:
      - '[Model] AI Model Catalog'
    get:
      description: Read one AI model with every artifact it is published as
      operationId: GetModel
      parameters:
      - default: qwen3-vl-8b
        description: AI model ID
        in: path
        name: modelId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: AI model metadata
          schema:
            $ref: '#/definitions/model.Model'
        "404":
          description: AI model not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Get an AI model
      tags:
      - '[Model] AI Model Catalog'
  /models/{modelId}/artifacts/{artifactId}/compose:
    get:
      description: 'Render the docker-compose.yml that runs one artifact of a model
        with one runtime profile, without deploying anything. The pairing is refused
        with 422 unless the artifact lists the runtime and the runtime loads the artifact
        format. The file starts with one `docker compose up -d`: for vllm it runs
        the OpenAI compatible server with --model set to the artifact ref (and --runner
        pooling for an embedding model); for ollama it runs the server and a one-shot
        container that pulls the model once the server is healthy. HF_TOKEN is left
        to the environment or a .env file beside the compose file. Each arg is appended
        to the vllm command after those arguments, as inference.args of POST /deployments
        is; ollama refuses them with 400.'
      operationId: GetModelCompose
      parameters:
      - default: qwen3-vl-8b
        description: AI model ID
        in: path
        name: modelId
        required: true
        type: string
      - default: hf-bf16
        description: Artifact ID within the model
        in: path
        name: artifactId
        required: true
        type: string
      - description: Runtime profile ID. Defaults to the first runtime the artifact
          lists; an artifact that lists none is refused with 422
        in: query
        name: runtimeId
        type: string
      - default: false
        description: Reserve every NVIDIA GPU of the node for the runtime
        in: query
        name: gpu
        type: boolean
      - collectionFormat: multi
        description: Extra runtime argument, appended after the catalog args of the
          artifact (runtimes[].args) and repeated for each, such as arg=--max-model-len&arg=32768
        in: query
        items:
          type: string
        name: arg
        type: array
      produces:
      - text/yaml
      - application/json
      responses:
        "200":
          description: docker-compose.yml, as text/yaml
          schema:
            type: string
        "400":
          description: gpu is not a boolean, or an arg is refused
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "404":
          description: AI model, artifact or runtime profile not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "422":
          description: The artifact cannot be run with the runtime
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Preview the compose file of an inference service
      tags:
      - '[Model] AI Model Catalog'
  /models/sync:
    get:
      description: 'Report whether the catalog sync is enabled and running, how long
        it waits between scheduled runs, and how the last run of each configured source
        went: when it started and finished, how many models the source returned, what
        they did to the catalog (added, updated, marked stale, skipped because another
        origin holds the id, dropped as invalid) and the error when the source failed.
        A failed source leaves its entries as they were. Before a source has run once
        only its name is given. With AIAPP_CATALOG_SYNC_ENABLED off, enabled is false
        and sources is empty.'
      operationId: GetModelSync
      produces:
      - application/json
      responses:
        "200":
          description: Catalog sync status
          schema:
            $ref: '#/definitions/catalogsync.Status'
      security:
      - BearerAuth: []
      summary: Read the catalog sync status
      tags:
      - '[Model] AI Model Catalog'
    post:
      description: 'Start one run of every configured source in the background and
        return at once with the status, running true. Poll GET /models/sync for the
        results. The sync adds the models a source lists, updates the ones it added
        before (keeping runtimes[].verifiedAt), marks stale the ones the source no
        longer lists and never changes a model of origin seed or manual or of another
        source. Only one run happens at a time: while one is in progress, including
        the scheduled one, this answers 409.'
      operationId: PostModelSync
      produces:
      - application/json
      responses:
        "202":
          description: Run started
          schema:
            $ref: '#/definitions/catalogsync.Status'
        "409":
          description: A run is already in progress
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "503":
          description: The catalog sync is disabled (AIAPP_CATALOG_SYNC_ENABLED is
            off)
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Run the catalog sync now
      tags:
      - '[Model] AI Model Catalog'
  /readyz:
    get:
      description: Report whether the service finished initialization and can accept
        requests
      operationId: GetReadyz
      produces:
      - application/json
      responses:
        "200":
          description: Service is ready
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "503":
          description: Service is still initializing
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      summary: Check service readiness
      tags:
      - '[Health] Service Health'
  /recommendations/apps:
    post:
      consumes:
      - application/json
      description: 'Ask the configured application recommender which uploaded application
        versions fit a requirement. Every request field is optional; an empty body
        asks for any application. The request is validated first, so a malformed request
        is refused with 400 whether or not a recommender is configured; inference[].modelId
        must name a model of the catalog. No recommender is built in: until AIAPP_RECOMMENDER_APP
        names a registered implementation of internal/recommend, a valid request is
        answered with 501. Candidates are ordered best first, at most maxCandidates
        of them, and each names an uploaded application and one of its versions, ready
        for the app field of POST /deployments.'
      operationId: PostAppRecommendation
      parameters:
      - description: What the application is needed for
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/recommend.AppRecommendReq'
      produces:
      - application/json
      responses:
        "200":
          description: Recommended applications, best first
          schema:
            $ref: '#/definitions/recommend.AppRecommendResp'
        "400":
          description: Malformed request, a field out of range, or a model not in
            the catalog
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: The recommender failed or returned a candidate the application
            store does not hold
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "501":
          description: No application recommender is configured
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Recommend applications for a requirement
      tags:
      - '[Recommendation] Model and Application Recommendation'
  /recommendations/models:
    post:
      consumes:
      - application/json
      description: 'Ask the configured model recommender which model artifact and
        runtime pairings of the catalog fit a requirement. Every request field is
        optional; an empty body asks for any model. The request is validated first,
        so a malformed request is refused with 400 whether or not a recommender is
        configured. No recommender is built in: until AIAPP_RECOMMENDER_MODEL names
        a registered implementation of internal/recommend, a valid request is answered
        with 501. Candidates are ordered best first, at most maxCandidates of them,
        and each names a model, an artifact of it and a runtime the artifact lists,
        ready for the inference field of POST /deployments.'
      operationId: PostModelRecommendation
      parameters:
      - description: What the model is needed for
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/recommend.ModelRecommendReq'
      produces:
      - application/json
      responses:
        "200":
          description: Recommended models, best first
          schema:
            $ref: '#/definitions/recommend.ModelRecommendResp'
        "400":
          description: Malformed request, or a field out of range
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: The recommender failed or returned a candidate the catalog
            does not hold
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "501":
          description: No model recommender is configured
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Recommend models for a requirement
      tags:
      - '[Recommendation] Model and Application Recommendation'
  /runtimes:
    get:
      description: 'List the built-in inference runtime profiles an inference deployment
        can run with: the pinned container image, the artifact formats each loads,
        and the port, health path and OpenAI compatible API path it serves. Profiles
        are read only. An artifact runs on a runtime when the artifact lists the runtime
        id in runtimes[].runtimeId and the runtime lists the artifact format'
      operationId: GetAllRuntimeProfiles
      produces:
      - application/json
      responses:
        "200":
          description: Runtime profile list, ordered by id
          schema:
            $ref: '#/definitions/model.RuntimeProfileListResp'
      security:
      - BearerAuth: []
      summary: List inference runtime profiles
      tags:
      - '[Model] Inference Runtime Profiles'
  /runtimes/{runtimeId}:
    get:
      description: Read one built-in inference runtime profile
      operationId: GetRuntimeProfile
      parameters:
      - default: vllm
        description: Runtime profile ID
        in: path
        name: runtimeId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Runtime profile
          schema:
            $ref: '#/definitions/model.RuntimeProfile'
        "404":
          description: Runtime profile not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Get an inference runtime profile
      tags:
      - '[Model] Inference Runtime Profiles'
  /status:
    get:
      description: |-
        Check, at the time of the call, what deploying onto nodes depends on, and answer 200 with what was found whether or not each dependency is up. Nothing is created or changed in any of them.

        semaphore: whether GET /api/ping answers (reachable, latencyMs), whether the configured token or user name and password are accepted (authenticated), the version from /api/info, whether the project (AIAPP_SEMAPHORE_PROJECT) exists and whether the template of each deployment playbook (aiapp-install-docker, aiapp-compose-up, aiapp-copy-and-run, aiapp-compose-down) exists. A project or template that does not exist yet is not a fault: the first deployment that needs it creates it. uiUrl is AIAPP_SEMAPHORE_UI_URL, the web UI that the taskUrl of each recorded playbook run points at; without it records carry no task links. tumblebug: whether CB-Tumblebug GET /readyz answers. stage: whether a file can be created in AIAPP_STAGE_ROOT. dryRun and openPorts are AIAPP_TUMBLEBUG_DRY_RUN and AIAPP_DEPLOYMENT_OPEN_PORTS. Each check gives up after 5 seconds. URLs are shown without credentials and no credential is part of the response.

        GET /readyz stays the liveness probe: it says only whether this service started, and calls nothing.
      operationId: GetStatus
      produces:
      - application/json
      responses:
        "200":
          description: What each dependency answered
          schema:
            $ref: '#/definitions/model.ServiceStatus'
      security:
      - BearerAuth: []
      summary: Check the dependencies of deployment
      tags:
      - '[Health] Service Health'
  /tools:
    get:
      description: List every tool the agent may call, with its risk grade and whether
        the dry-run guard applies. Exposed so another agent framework can adopt the
        same tool surface
      operationId: GetTools
      produces:
      - application/json
      responses:
        "200":
          description: Tool catalog
          schema:
            $ref: '#/definitions/model.ToolListResp'
      security:
      - BearerAuth: []
      summary: List agent tools
      tags:
      - '[Agent] AI Application Automation Agent'
  /ui:
    get:
      description: Serve the single page console that calls this service's own API
      operationId: GetConsole
      produces:
      - text/html
      responses:
        "200":
          description: The console page
          schema:
            type: string
      summary: Open the operator console
      tags:
      - '[Console] Operator Console'
securityDefinitions:
  BearerAuth:
    description: '"Bearer <token>". Required on every route but readiness, the console
      and this documentation when AIAPP_AUTH_TOKEN is set.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
