basePath: /aiapp
definitions:
  engine.Card:
    properties:
      description:
        type: string
      displayName:
        type: string
      dryRun:
        description: DryRun is the AI-App dry-run state, as of the current MCP session.
        type: boolean
      framework:
        example: AI-Ops
        type: string
      mcp:
        $ref: '#/definitions/engine.CardMCP'
      mcpEndpoint:
        type: string
      name:
        example: ai-mcmp-app-automation-engine
        type: string
      owner:
        example: innogrid
        type: string
      registration:
        allOf:
        - $ref: '#/definitions/model.AgentRegistration'
        description: |-
          Registration is how the last registry registration went. It is left out
          of the card sent to the registry.
      servesFramework:
        example: AI-App
        type: string
      tools:
        $ref: '#/definitions/engine.CardToolGroup'
      usesLLM:
        description: 'UsesLLM is always false: the workflows are fixed.'
        type: boolean
      version:
        example: 0.1.0
        type: string
      workflowEndpoint:
        type: string
      workflows:
        example:
        - deploy
        - heal
        - control
        - status
        items:
          type: string
        type: array
    type: object
  engine.CardMCP:
    properties:
      appServer:
        $ref: '#/definitions/engine.CardMCPServer'
    type: object
  engine.CardMCPServer:
    properties:
      connected:
        type: boolean
      toolCount:
        type: integer
      url:
        example: http://127.0.0.1:8090/aiapp/mcp
        type: string
    type: object
  engine.CardToolGroup:
    properties:
      exposed:
        items:
          $ref: '#/definitions/model.AgentCardTool'
        type: array
      uses:
        description: |-
          Uses names the AI-App tools the engine calls, whether or not it is
          connected. A tool carries its grade only while the engine is connected
          to an AI-App service that publishes it.
        items:
          $ref: '#/definitions/model.AgentCardTool'
        type: array
    type: object
  engine.Run:
    properties:
      dryRun:
        description: DryRun is the AI-App dry-run state the run executed under.
        type: boolean
      endedAt:
        type: string
      input: {}
      message:
        type: string
      nsId:
        example: default
        type: string
      runId:
        example: eng-mbt3x2k1
        type: string
      startedAt:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/engine.RunStatus'
        enum:
        - succeeded
        - failed
        - blocked
        example: blocked
      steps:
        items:
          $ref: '#/definitions/engine.Step'
        type: array
      workflow:
        enum:
        - deploy
        - heal
        - control
        - status
        example: deploy
        type: string
    type: object
  engine.RunListResp:
    properties:
      runs:
        items:
          $ref: '#/definitions/engine.Run'
        type: array
    type: object
  engine.RunStatus:
    enum:
    - succeeded
    - failed
    - blocked
    type: string
    x-enum-varnames:
    - RunSucceeded
    - RunFailed
    - RunBlocked
  engine.Step:
    properties:
      endedAt:
        type: string
      error:
        type: string
      index:
        type: integer
      input: {}
      message:
        description: |-
          Message says why a step was blocked, waits or was skipped, or what its
          result meant for the workflow.
        type: string
      name:
        example: create the deployment
        type: string
      output:
        description: Output is the tool result as the AI-App service returned it.
        type: object
      startedAt:
        description: StartedAt and EndedAt are absent on a step that was not run.
        type: string
      status:
        allOf:
        - $ref: '#/definitions/engine.StepStatus'
        enum:
        - succeeded
        - failed
        - blocked
        - waiting
        - skipped
        example: succeeded
      tool:
        description: Tool is the AI-App MCP tool the step calls.
        example: create_deployment
        type: string
    type: object
  engine.StepStatus:
    enum:
    - succeeded
    - failed
    - blocked
    - waiting
    - skipped
    type: string
    x-enum-varnames:
    - StepSucceeded
    - StepFailed
    - StepBlocked
    - StepWaiting
    - StepSkipped
  model.AgentCardTool:
    properties:
      grade:
        description: Grade is one of read, review, write, destructive.
        type: string
      guardedByDryRun:
        type: boolean
      name:
        type: string
    type: object
  model.AgentRegistration:
    properties:
      at:
        type: string
      message:
        type: string
      registryUrl:
        type: string
      status:
        description: Status is disabled, pending, registered or failed.
        example: registered
        type: string
    type: object
  model.App:
    properties:
      name:
        description: |-
          Name identifies the application: lower case letters, digits, ".", "_"
          and "-", at most 63 characters. Uploading again under the same name adds
          a version.
        example: open-webui
        type: string
      versions:
        description: Versions are the uploaded versions, oldest first.
        items:
          $ref: '#/definitions/model.AppVersion'
        type: array
    type: object
  model.AppFile:
    properties:
      name:
        description: |-
          Name is the file name on the node: letters, digits, ".", "_", "+" and
          "-", not starting with ".", at most 255 characters.
        example: docker-compose.yml
        type: string
      sha256:
        description: SHA256 is the hex encoded SHA-256 digest of the file content.
        example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        type: string
      sizeBytes:
        description: SizeBytes is the file size in bytes.
        example: 812
        type: integer
    type: object
  model.AppListResp:
    properties:
      apps:
        items:
          $ref: '#/definitions/model.App'
        type: array
    type: object
  model.AppVersion:
    properties:
      createdAt:
        description: CreatedAt is when the version was registered.
        example: "2026-10-29T12:00:00Z"
        type: string
      files:
        description: |-
          Files are the uploaded files, in upload order. They are copied flat into
          the folder the script runs in.
        items:
          $ref: '#/definitions/model.AppFile'
        type: array
      script:
        description: |-
          Script is the shell script run on the node from the folder the files
          are copied to. At most 64 KiB.
        example: docker compose up -d
        type: string
      version:
        description: |-
          Version numbers the uploads of one name from 1, one higher than the
          highest version present when it was uploaded.
        example: 1
        type: integer
    type: object
  model.ArchiveListResp:
    properties:
      records:
        items:
          $ref: '#/definitions/model.ArchiveRecord'
        type: array
    type: object
  model.ArchiveRecord:
    properties:
      answer:
        type: string
      endedAt:
        type: string
      error:
        type: string
      intent:
        type: string
      kind:
        example: intent
        type: string
      nsId:
        type: string
      runId:
        type: string
      startedAt:
        type: string
      steps:
        items:
          $ref: '#/definitions/model.ToolStep'
        type: array
      usage:
        $ref: '#/definitions/model.TokenUsage'
    type: object
  model.Artifact:
    properties:
      engines:
        description: |-
          Engines are the inference engines known to load this artifact. Each
          engine must be listed explicitly: the same file format may load in one
          engine version and not in another. Filter with ?engine=.
        items:
          $ref: '#/definitions/model.EngineCompat'
        type: array
      format:
        description: |-
          Format is the file format the engine loads: hf for Hugging Face
          safetensors, gguf for GGUF. Filter with ?format=.
        example: hf
        type: string
      id:
        description: |-
          ID identifies the artifact within its model, with the same character
          rules as a model ID.
        example: hf-bf16
        type: string
      precision:
        description: |-
          Precision is the precision or quantization exactly as the source states
          it, such as BF16, FP8 or Q4_K_M. It is not normalized. Empty means
          unknown.
        example: BF16
        type: string
      ref:
        description: |-
          Ref is the name of the artifact at its source: a Hugging Face repository
          id, an Ollama model tag, or an image reference.
        example: Qwen/Qwen3-VL-8B-Instruct
        type: string
      sizeGiB:
        description: |-
          SizeGiB is the download size in GiB (2^30 bytes). Zero or absent means
          unknown.
        example: 16.3
        type: number
      source:
        description: |-
          Source is where the artifact is downloaded from, such as huggingface,
          kaggle, ollama or docker-model-runner. Filter with ?source=.
        example: huggingface
        type: string
    required:
    - engines
    - format
    - id
    - ref
    - source
    type: object
  model.EngineCompat:
    properties:
      engine:
        description: Engine is the engine profile ID, as listed by GET /engines.
        example: vllm
        type: string
      minVersion:
        description: |-
          MinVersion is the oldest engine version known to load the artifact.
          Empty means not recorded.
        example: 0.11.0
        type: string
    required:
    - engine
    type: object
  model.EngineProfile:
    properties:
      apiBasePath:
        description: |-
          APIBasePath is the path of the OpenAI compatible API, appended to
          http://<node>:<port> by whoever calls the model service.
        example: /v1
        type: string
      formats:
        description: Formats are the artifact formats this engine loads.
        example:
        - hf
        items:
          type: string
        type: array
      healthPath:
        description: HealthPath answers 200 once the engine is up.
        example: /health
        type: string
      id:
        description: ID is the engine identifier artifacts refer to in engines[].engine.
        example: vllm
        type: string
      image:
        description: Image is the container image, pinned to a release tag.
        example: vllm/vllm-openai:v0.32.0
        type: string
      port:
        description: |-
          Port is the TCP port the engine serves its API on, inside the container
          and on the node.
        example: 8000
        type: integer
    required:
    - formats
    - id
    - image
    - port
    type: object
  model.EngineProfileListResp:
    properties:
      engines:
        items:
          $ref: '#/definitions/model.EngineProfile'
        type: array
    type: object
  model.Model:
    properties:
      artifacts:
        description: |-
          Artifacts are the published forms of the model that an engine can load.
          At least one is required.
        items:
          $ref: '#/definitions/model.Artifact'
        type: array
      contextLength:
        description: |-
          ContextLength is the context window in tokens. Zero or absent means
          unknown, not unlimited.
        example: 262144
        type: integer
      family:
        description: Family is the model family the model belongs to.
        example: qwen3-vl
        type: string
      id:
        description: |-
          ID is the catalog identifier: lower case letters, digits, ".", "_" and
          "-", at most 63 characters.
        example: qwen3-vl-8b
        type: string
      inputModalities:
        description: |-
          InputModalities are the kinds of input the model accepts, such as text or
          image. Filter with ?modality=.
        example:
        - text
        - image
        items:
          type: string
        type: array
      license:
        description: License is the license identifier of the weights. Empty means
          unknown.
        example: apache-2.0
        type: string
      name:
        description: Name is the display name, usually the name the publisher uses.
        example: Qwen3-VL-8B-Instruct
        type: string
      parameters:
        description: Parameters is the parameter count as the publisher writes it.
        example: 8B
        type: string
      publisher:
        description: Publisher is who released the model.
        example: Qwen
        type: string
      tasks:
        description: |-
          Tasks are what the model is used for, such as chat, vision-chat or
          embedding. Filter with ?task=.
        example:
        - vision-chat
        items:
          type: string
        type: array
    required:
    - artifacts
    - id
    - name
    type: object
  model.ModelListResp:
    properties:
      models:
        items:
          $ref: '#/definitions/model.Model'
        type: array
    type: object
  model.NodeAppReq:
    properties:
      env:
        additionalProperties:
          type: string
        description: |-
          Env is written to the .env file in the folder the script runs in, and
          exported before the script starts. Names match [A-Z_][A-Z0-9_]*; values
          hold no line break and no single quote. Addresses of other nodes go
          here.
        type: object
      name:
        description: Name is an uploaded application (GET /apps).
        example: open-webui
        type: string
      version:
        description: |-
          Version is the version to deploy. 0 takes the latest; the record keeps
          the version taken.
        example: 1
        type: integer
    required:
    - name
    type: object
  model.NodeControlReq:
    properties:
      action:
        description: Action is passed to CB-Tumblebug node control.
        enum:
        - suspend
        - resume
        - reboot
        - terminate
        example: reboot
        type: string
    required:
    - action
    type: object
  model.NodeControlResp:
    properties:
      action:
        example: reboot
        type: string
      id:
        example: 3f9b2c4e-8a51-4d27-9e0c-5b1f6a7d2e48
        type: string
      nodes:
        description: Nodes are the per node results, in deployment order.
        items:
          $ref: '#/definitions/model.NodeControlResult'
        type: array
    type: object
  model.NodeControlResult:
    properties:
      message:
        description: Message is the CB-Tumblebug answer, or why nothing was sent.
        example: Rebooting the node vm1
        type: string
      status:
        description: |-
          Status is done, failed, or blocked when nothing was sent because the
          service or the deployment is in dry run.
        enum:
        - done
        - failed
        - blocked
        example: done
        type: string
      target:
        $ref: '#/definitions/model.NodeDeployTarget'
    type: object
  model.NodeDeployNode:
    properties:
      csp:
        description: CSP is the cloud, from connectionConfig.providerName, in lower
          case.
        example: aws
        type: string
      host:
        description: Host is the public IP, or the private IP when the node has none.
        example: 203.0.113.10
        type: string
      port:
        description: Port is the SSH port.
        example: 22
        type: integer
      region:
        description: Region and Zone are where the node runs.
        example: ap-northeast-2
        type: string
      specId:
        description: SpecID is the node spec in CB-Tumblebug.
        example: aws+ap-northeast-2+g4dn.xlarge
        type: string
      user:
        description: User is the SSH user.
        example: cb-user
        type: string
      zone:
        example: ap-northeast-2a
        type: string
    type: object
  model.NodeDeployNodeLogs:
    properties:
      status:
        example: succeeded
        type: string
      steps:
        items:
          $ref: '#/definitions/model.NodeDeployStep'
        type: array
      target:
        $ref: '#/definitions/model.NodeDeployTarget'
    type: object
  model.NodeDeployResult:
    properties:
      compose:
        description: Compose is the rendered docker-compose.yml of a model service.
        type: string
      error:
        description: Error is why the node failed.
        type: string
      finishedAt:
        description: FinishedAt is when work on the node ended.
        example: "2026-10-29T12:04:59Z"
        type: string
      gpu:
        description: |-
          GPU is whether the engine was given the node's GPUs and the NVIDIA
          Container Toolkit was installed.
        example: false
        type: boolean
      gpuSource:
        description: |-
          GPUSource says where GPU came from: request, spec, or default when the
          spec could not be read.
        enum:
        - request
        - spec
        - default
        example: spec
        type: string
      node:
        allOf:
        - $ref: '#/definitions/model.NodeDeployNode'
        description: |-
          Node is how the node was reached, as read from CB-Tumblebug. Absent
          when the node could not be read. The SSH key is never included.
      notes:
        description: |-
          Notes record decisions made for this node, such as why the spec could
          not be read.
        items:
          type: string
        type: array
      serviceUrl:
        description: |-
          ServiceURL is the model service API on the node, built from the public
          or private IP the node was reached at, the engine port and its API base
          path. Model services only.
        example: http://203.0.113.10:8000/v1
        type: string
      stageDir:
        description: |-
          StageDir is the folder the files were placed in on the shared stage
          volume: <AIAPP_STAGE_ROOT>/<deployment id>/<csp>-<node id>.
        example: /var/lib/aiapp/stage/3f9b2c4e-8a51-4d27-9e0c-5b1f6a7d2e48/aws-vm1
        type: string
      startedAt:
        description: StartedAt is when work on the node began.
        example: "2026-10-29T12:00:01Z"
        type: string
      status:
        description: Status is pending, running, succeeded, failed, dry-run or interrupted.
        enum:
        - pending
        - running
        - succeeded
        - failed
        - dry-run
        - interrupted
        example: succeeded
        type: string
      steps:
        description: |-
          Steps are the playbooks run on the node, in order. A step that failed
          ends the node.
        items:
          $ref: '#/definitions/model.NodeDeployStep'
        type: array
      target:
        allOf:
        - $ref: '#/definitions/model.NodeDeployTarget'
        description: Target is the target as requested.
    type: object
  model.NodeDeployStep:
    properties:
      cleanupErrors:
        description: |-
          CleanupErrors name the Semaphore key or inventory of this run that
          could not be deleted. A key named here may still be stored in Semaphore.
        items:
          type: string
        type: array
      error:
        description: Error is why the run could not be registered, started or followed.
        type: string
      finishedAt:
        example: "2026-10-29T12:02:10Z"
        type: string
      output:
        description: |-
          Output is the task log, one line per entry. It is returned by
          GET /deployments/{id}/logs and left out of the deployment record.
        items:
          type: string
        type: array
      playbook:
        description: Playbook is install-docker.yml, compose-up.yml or copy-and-run.yml.
        example: compose-up.yml
        type: string
      startedAt:
        example: "2026-10-29T12:00:02Z"
        type: string
      status:
        description: |-
          Status is the final Semaphore task status: success, error, stopped or
          rejected, or empty when the task never started.
        example: success
        type: string
      taskId:
        description: TaskID is the Semaphore task, kept in Semaphore with its log.
        example: 2147483645
        type: integer
    type: object
  model.NodeDeployTarget:
    properties:
      infraId:
        description: InfraID is the CB-Tumblebug Infra the node belongs to.
        example: travel
        type: string
      k8sClusterId:
        description: K8sClusterID is reserved for kind "k8s".
        example: ""
        type: string
      kind:
        description: |-
          Kind is "node". "k8s" is reserved for Kubernetes clusters and refused
          with 422.
        enum:
        - node
        - k8s
        example: node
        type: string
      nodeGroupId:
        description: NodeGroupID is reserved for kind "k8s".
        example: ""
        type: string
      nodeId:
        description: NodeID is the node within the Infra.
        example: vm1
        type: string
      nsId:
        description: NsID is the CB-Tumblebug namespace of the Infra.
        example: etri
        type: string
    required:
    - kind
    - nsId
    type: object
  model.NodeDeployment:
    properties:
      createdAt:
        description: CreatedAt is when the request was accepted.
        example: "2026-10-29T12:00:00Z"
        type: string
      dryRun:
        description: |-
          DryRun is true when the service ran with dry run on: only the node
          look-up and file placement were done.
        example: false
        type: boolean
      error:
        description: Error is why the deployment as a whole stopped, when it did.
        type: string
      finishedAt:
        description: FinishedAt is when the last node finished. Absent while it runs.
        example: "2026-10-29T12:05:00Z"
        type: string
      id:
        description: |-
          ID is a UUID (version 4). It names the stage folder and, on each node,
          /opt/aiapp/<id>.
        example: 3f9b2c4e-8a51-4d27-9e0c-5b1f6a7d2e48
        type: string
      nodes:
        description: Nodes are the per node results, in request order.
        items:
          $ref: '#/definitions/model.NodeDeployResult'
        type: array
      request:
        allOf:
        - $ref: '#/definitions/model.NodeDeploymentReq'
        description: |-
          Request is the request as accepted, with the engine and app version
          that were taken filled in.
      status:
        description: |-
          Status is pending, running, succeeded (every node), failed (every node),
          partial (some nodes), dry-run (files placed, nothing run) or interrupted
          (the service stopped while it ran).
        enum:
        - pending
        - running
        - succeeded
        - failed
        - partial
        - dry-run
        - interrupted
        example: succeeded
        type: string
      type:
        description: Type is the request type.
        enum:
        - model-service
        - app
        example: model-service
        type: string
    type: object
  model.NodeDeploymentListResp:
    properties:
      deployments:
        description: Deployments are ordered newest first, without task output.
        items:
          $ref: '#/definitions/model.NodeDeployment'
        type: array
    type: object
  model.NodeDeploymentLogs:
    properties:
      id:
        example: 3f9b2c4e-8a51-4d27-9e0c-5b1f6a7d2e48
        type: string
      nodes:
        description: Nodes hold, per target, the steps with their output.
        items:
          $ref: '#/definitions/model.NodeDeployNodeLogs'
        type: array
      status:
        example: succeeded
        type: string
    type: object
  model.NodeDeploymentReq:
    properties:
      app:
        allOf:
        - $ref: '#/definitions/model.NodeAppReq'
        description: App is required when type is app.
      modelService:
        allOf:
        - $ref: '#/definitions/model.NodeModelServiceReq'
        description: ModelService is required when type is model-service.
      targets:
        description: Targets are the nodes to deploy to, at most 32, each once.
        items:
          $ref: '#/definitions/model.NodeDeployTarget'
        type: array
      type:
        description: |-
          Type is "model-service" or "app"; the field of the same name below
          carries what to deploy.
        enum:
        - model-service
        - app
        example: model-service
        type: string
    required:
    - targets
    - type
    type: object
  model.NodeModelServiceReq:
    properties:
      artifactId:
        description: ArtifactID is an artifact of that model.
        example: hf-bf16
        type: string
      engine:
        description: |-
          Engine is an engine profile ID (GET /engines) the artifact lists. Empty
          takes the first engine the artifact lists.
        example: vllm
        type: string
      env:
        additionalProperties:
          type: string
        description: |-
          Env is added to the engine container environment and written to the
          .env file beside the compose file. Names match [A-Z_][A-Z0-9_]*;
          values hold no line break and no single quote.
        type: object
      gpu:
        description: |-
          GPU reserves every NVIDIA GPU of the node for the engine and installs
          the NVIDIA Container Toolkit. Omitted, it is true when the node spec in
          CB-Tumblebug has acceleratorType gpu, and false when the spec cannot be
          read; the node result says which.
        example: false
        type: boolean
      modelId:
        description: ModelID is a model of the model catalog (GET /models).
        example: qwen3-embedding-0.6b
        type: string
    required:
    - artifactId
    - modelId
    type: object
  model.SimpleMsg:
    properties:
      message:
        example: AI application not found
        type: string
    type: object
  model.TokenUsage:
    properties:
      inputTokens:
        type: integer
      outputTokens:
        type: integer
    type: object
  model.ToolDescriptor:
    properties:
      description:
        type: string
      grade:
        description: Grade is one of read, review, write, destructive.
        type: string
      guardedByDryRun:
        description: GuardedByDryRun is true when the dry-run setting can block this
          tool.
        type: boolean
      inputSchema: {}
      name:
        type: string
    type: object
  model.ToolListResp:
    properties:
      dryRun:
        type: boolean
      tools:
        items:
          $ref: '#/definitions/model.ToolDescriptor'
        type: array
    type: object
  model.ToolStep:
    properties:
      calledAt:
        type: string
      duration:
        type: string
      error:
        type: string
      executed:
        description: Executed is false when the dry-run guard blocked an infrastructure
          change.
        type: boolean
      grade:
        description: Grade is the tool risk grade that decided whether the call was
          executed.
        type: string
      index:
        type: integer
      input: {}
      output: {}
      tool:
        type: string
    type: object
info:
  contact: {}
  description: Keeps an AI model catalog (models, the artifacts each is published
    as, and the inference engine profiles they run on), registers AI applications
    as a name, files and a script with versions, deploys a model service or an application
    onto nodes CB-Tumblebug already runs through Semaphore, publishes the same capabilities
    as MCP tools and archives every deploy and control call. Automation engine routes
    and the partner natural language agent routes are forwarded to their own processes.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: AI-MCMP AI-App Service (Prototype)
  version: 0.1.0
paths:
  /apps:
    get:
      description: 'List every uploaded AI application, ordered by name, with every
        version: its number, script, files (name, size and SHA-256) and upload time.
        Versions are listed oldest first.'
      operationId: GetAllApps
      produces:
      - application/json
      responses:
        "200":
          description: AI application list
          schema:
            $ref: '#/definitions/model.AppListResp'
      security:
      - BearerAuth: []
      summary: List AI applications
      tags:
      - '[App] AI Applications'
    post:
      consumes:
      - multipart/form-data
      description: 'Upload the files of an AI application and the script that deploys
        it, as one multipart/form-data body. Uploading again under a registered name
        adds the next version (the highest version plus one); earlier versions are
        kept. A node receiving a version gets every file in one folder and runs the
        script from that folder; the target node and the addresses of other nodes
        are given by the deployment request, not here. File names are the filename
        of each files part, used as is: one name of letters, digits, ".", "_", "+"
        and "-", not starting with "." (.env is written by the deployment request),
        at most 255 characters, each name once. A name with a path such as ../x or
        conf/x is refused, not shortened. The script is at most 64 KiB, at most 256
        files are accepted, and the script and files together may not exceed the upload
        bound of the service (AIAPP_APP_UPLOAD_MAX_BYTES, 256 MiB by default).'
      operationId: PostApp
      parameters:
      - default: open-webui
        description: 'Application name: lower case letters, digits, dot, underscore
          and hyphen, starting with a letter or digit, at most 63 characters'
        in: formData
        name: name
        required: true
        type: string
      - description: Deployment script. Send it as this text field or as a file part
          named script (with a filename), exactly once
        in: formData
        name: script
        required: true
        type: string
      - description: Files the script uses, such as docker-compose.yml. Repeat the
          part for each file
        in: formData
        name: files
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: The version registered, with the size and SHA-256 of every
            file
          schema:
            $ref: '#/definitions/model.AppVersion'
        "400":
          description: Not multipart, name or script missing, script given twice,
            or a file name not allowed
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "413":
          description: The script and files exceed the upload bound
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: The upload could not be written to the store
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Upload an AI application
      tags:
      - '[App] AI Applications'
  /apps/{name}:
    delete:
      description: Remove an AI application with every version and its stored files.
        Applications already deployed on nodes are untouched
      operationId: DeleteApp
      parameters:
      - description: Application name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: AI application deleted
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "404":
          description: AI application not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: The stored files could not be removed
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Delete an AI application
      tags:
      - '[App] AI Applications'
    get:
      description: Read one AI application with every version, oldest first
      operationId: GetApp
      parameters:
      - default: open-webui
        description: Application name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: AI application
          schema:
            $ref: '#/definitions/model.App'
        "404":
          description: AI application not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Get an AI application
      tags:
      - '[App] AI Applications'
  /apps/{name}/versions/{version}:
    get:
      description: 'Read one version of an AI application: its script and the name,
        size and SHA-256 of every file'
      operationId: GetAppVersion
      parameters:
      - default: open-webui
        description: Application name
        in: path
        name: name
        required: true
        type: string
      - default: 1
        description: Version number, from 1
        in: path
        name: version
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: AI application version
          schema:
            $ref: '#/definitions/model.AppVersion'
        "400":
          description: version is not a positive integer
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "404":
          description: AI application or version not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Get one version of an AI application
      tags:
      - '[App] AI Applications'
  /archive:
    get:
      description: List archived deployment and control runs, newest first. A record
        holds the instruction, every tool call with its arguments and the guard verdict
      operationId: GetArchive
      parameters:
      - default: 20
        description: How many records to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Archived runs
          schema:
            $ref: '#/definitions/model.ArchiveListResp'
        "400":
          description: Malformed limit
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: Archive lookup failed
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: List archived runs
      tags:
      - '[Archive] Deploy and Control Archive'
  /archive/{runId}:
    get:
      description: Read one archived run by its identifier
      operationId: GetArchiveRun
      parameters:
      - description: Run ID
        in: path
        name: runId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Archived run
          schema:
            $ref: '#/definitions/model.ArchiveRecord'
        "404":
          description: Run not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: Archive lookup failed
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Get one archived run
      tags:
      - '[Archive] Deploy and Control Archive'
  /deployments:
    get:
      description: List every deployment made through POST /deployments, newest first,
        with the status of every node. Task output is left out; read it with GET /deployments/{id}/logs.
        Records are kept in AIAPP_DEPLOYMENT_STORE_FILE when it is set, and in memory
        otherwise.
      operationId: GetAllNodeDeployments
      produces:
      - application/json
      responses:
        "200":
          description: Deployments, newest first
          schema:
            $ref: '#/definitions/model.NodeDeploymentListResp'
      security:
      - BearerAuth: []
      summary: List deployments onto nodes
      tags:
      - '[Deployment] Node Deployment'
    post:
      consumes:
      - application/json
      description: |-
        Deploy a model service or an uploaded AI application onto nodes CB-Tumblebug already runs. This service does not create VMs.

        type model-service needs modelService: modelId and artifactId from GET /models, and optionally engine (an engine profile the artifact lists; defaults to its first) and gpu. A docker-compose.yml is rendered from the artifact and the engine profile (preview it with GET /models/{modelId}/artifacts/{artifactId}/compose). type app needs app: name and version (0 takes the latest) from GET /apps. Both take env, written to a .env file next to the deployed files; names match [A-Z_][A-Z0-9_]*, values hold no line break and no single quote.

        Each target is {kind: node, nsId, infraId, nodeId}. The cloud, region, zone, address and SSH key are read from the node in CB-Tumblebug (public IP, or private IP when there is none). kind k8s is reserved and answered with 422. When gpu is omitted it is taken from the node spec (acceleratorType gpu); a spec that cannot be read means no GPU, and nodes[].notes says why.

        For every node, in parallel up to a bound: the files are placed in <AIAPP_STAGE_ROOT>/<id>/<csp>-<nodeId>/, then Semaphore runs install-docker (with the NVIDIA Container Toolkit on a GPU node) and then compose-up (model service, which waits for the engine health path from the node itself) or copy-and-run (app, which runs the app script from the folder the files are copied to, /opt/aiapp/<id> on the node). The SSH key is registered in Semaphore for the run only and deleted afterwards; it is never part of a record, a log or a response.

        The request is checked against the catalogs first: a malformed request is 400, an unknown model, artifact, engine or app is 404, and an artifact the engine cannot run is 422. An accepted request answers 202 with the record in status pending; follow it with GET /deployments/{id}. With dry run on (AIAPP_TUMBLEBUG_DRY_RUN), only the node look-up and the file placement are done, nothing is registered in Semaphore, and the finished record (status dry-run, with the rendered compose and the node addresses) is returned with 200.
      operationId: PostNodeDeployment
      parameters:
      - description: What to deploy and where
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.NodeDeploymentReq'
      produces:
      - application/json
      responses:
        "200":
          description: 'Dry run: the files were placed and nothing was run'
          schema:
            $ref: '#/definitions/model.NodeDeployment'
        "202":
          description: Accepted; the deployment goes on in the background
          schema:
            $ref: '#/definitions/model.NodeDeployment'
        "400":
          description: Malformed request
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "404":
          description: Model, artifact, engine profile or application not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "422":
          description: A k8s target, or an artifact the engine cannot run
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: The record could not be written
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Deploy onto existing nodes
      tags:
      - '[Deployment] Node Deployment'
  /deployments/{id}:
    get:
      description: 'Read one deployment: its status (pending, running, succeeded,
        failed, partial, dry-run, interrupted), and for every node its status, how
        it was reached (csp, region, zone, host, port, user, specId; never the key),
        whether it got the GPU and why, the stage folder, the rendered compose and
        service URL of a model service, and every playbook run with its Semaphore
        task ID and status. Task output is left out; read it with GET /deployments/{id}/logs.'
      operationId: GetNodeDeployment
      parameters:
      - description: Deployment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deployment record
          schema:
            $ref: '#/definitions/model.NodeDeployment'
        "404":
          description: Deployment not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Get a deployment onto nodes
      tags:
      - '[Deployment] Node Deployment'
  /deployments/{id}/control:
    post:
      consumes:
      - application/json
      description: Apply a CB-Tumblebug lifecycle action (suspend, resume, reboot
        or terminate) to every node of a deployment, one call per node. A node CB-Tumblebug
        refuses is reported failed and the others still get the action. Nothing is
        sent, and every node is reported blocked, when dry run is on or the deployment
        was a dry run. Every call is archived (kind node-control).
      operationId: PostNodeDeploymentControl
      parameters:
      - description: Deployment ID
        in: path
        name: id
        required: true
        type: string
      - description: Lifecycle action
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.NodeControlReq'
      produces:
      - application/json
      responses:
        "200":
          description: Per node result
          schema:
            $ref: '#/definitions/model.NodeControlResp'
        "400":
          description: Unknown action
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "404":
          description: Deployment not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Control the nodes of a deployment
      tags:
      - '[Deployment] Node Deployment'
  /deployments/{id}/logs:
    get:
      description: Read the Semaphore task log of every playbook run on every node
        of a deployment, one line per entry with colour codes removed. A step's output
        appears when its task ends. The tasks and their logs are also kept in Semaphore
        under the template of each playbook.
      operationId: GetNodeDeploymentLogs
      parameters:
      - description: Deployment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Task output per node and step
          schema:
            $ref: '#/definitions/model.NodeDeploymentLogs'
        "404":
          description: Deployment not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Get the task output of a deployment
      tags:
      - '[Deployment] Node Deployment'
  /engine/card:
    get:
      description: 'Report the engine card an agent registry reads: identity, that
        it uses no LLM, its workflows, the AI-App MCP server it calls and whether
        it is connected, the tools it publishes and the ones it calls, the dry-run
        state and how registration went'
      operationId: GetEngineCard
      produces:
      - application/json
      responses:
        "200":
          description: Engine card
          schema:
            $ref: '#/definitions/engine.Card'
        "502":
          description: Automation engine is not reachable from the AI-App service
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Describe the automation engine
      tags:
      - '[Engine] AI Application Automation Engine'
  /engine/runs:
    get:
      description: List archived engine runs, newest first, each with every step,
        its input and result, and whether the dry-run gate held it
      operationId: GetEngineRuns
      parameters:
      - default: 20
        description: How many runs to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Archived runs
          schema:
            $ref: '#/definitions/engine.RunListResp'
        "400":
          description: Malformed limit
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: Archive lookup failed
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: List automation engine runs
      tags:
      - '[Engine] AI Application Automation Engine'
  /engine/runs/{runId}:
    get:
      description: Read one archived engine run by its identifier
      operationId: GetEngineRun
      parameters:
      - description: Run ID
        in: path
        name: runId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Archived run
          schema:
            $ref: '#/definitions/engine.Run'
        "404":
          description: Run not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: Archive lookup failed
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Get one automation engine run
      tags:
      - '[Engine] AI Application Automation Engine'
  /engine/workflows/{workflow}:
    post:
      consumes:
      - application/json
      description: |-
        Run one fixed workflow as ordered AI-App tool calls, without a model, and archive the run.
        deploy takes the node deployment request of POST /deployments (model.NodeDeploymentReq: {type, targets, modelService | app}); it reads the model (get_model) or the application (get_app), creates the deployment (create_deployment) and reads it (get_deployment) until every node ended. A model service is checked to answer by the compose-up playbook inside the deployment. A deployment that succeeded on some nodes only (partial) fails the run.
        heal takes {deploymentId}; a deployment that is failed, partial, interrupted or a dry run is created once more from the request it was made with, and followed the same way. A succeeded deployment is left alone, a running one is refused.
        control takes {deploymentId, action} with action suspend, resume, reboot or terminate (control_node).
        status takes {deploymentId} and reports the deployment record and the last task output lines of every node (get_deployment, get_deployment_logs).
        A step held by the AI-App dry-run gate is reported as blocked and the steps that need it as waiting. A run whose steps failed is still returned with 200 and status failed. Served by the automation engine and forwarded by the AI-App service
      operationId: PostEngineWorkflow
      parameters:
      - description: Workflow
        enum:
        - deploy
        - heal
        - control
        - status
        in: path
        name: workflow
        required: true
        type: string
      - default: default
        description: Namespace ID
        in: query
        name: ns
        type: string
      - description: 'Workflow input: model.NodeDeploymentReq for deploy, {deploymentId}
          for heal and status, {deploymentId, action} for control'
        in: body
        name: input
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Run finished; see its status
          schema:
            $ref: '#/definitions/engine.Run'
        "400":
          description: Malformed or incomplete input
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "404":
          description: Unknown workflow
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "502":
          description: Automation engine is not reachable from the AI-App service
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "503":
          description: AI-App tool server is not reachable
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Run an automation engine workflow
      tags:
      - '[Engine] AI Application Automation Engine'
  /engines:
    get:
      description: 'List the built-in inference engine profiles a model service can
        run with: the pinned container image, the artifact formats each loads, and
        the port, health path and OpenAI compatible API path it serves. Profiles are
        read only. An artifact runs on an engine when the artifact lists the engine
        id and the engine lists the artifact format'
      operationId: GetAllEngineProfiles
      produces:
      - application/json
      responses:
        "200":
          description: Engine profile list, ordered by id
          schema:
            $ref: '#/definitions/model.EngineProfileListResp'
      security:
      - BearerAuth: []
      summary: List inference engine profiles
      tags:
      - '[Model] Inference Engine Profiles'
  /engines/{engineId}:
    get:
      description: Read one built-in inference engine profile
      operationId: GetEngineProfile
      parameters:
      - default: vllm
        description: Engine profile ID
        in: path
        name: engineId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Engine profile
          schema:
            $ref: '#/definitions/model.EngineProfile'
        "404":
          description: Engine profile not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Get an inference engine profile
      tags:
      - '[Model] Inference Engine Profiles'
  /models:
    get:
      description: 'List the AI models in the model catalog with every artifact each
        is published as. Each filter is optional and compared without regard to case;
        all given filters must match. task and modality match the model. format, engine
        and source match an artifact, and a model is listed only when one of its artifacts
        matches all three of them at once. Values are returned as the source states
        them: an absent contextLength, sizeGiB or precision means unknown, not zero.
        Sizing nodes from these values is left to the caller.'
      operationId: GetAllModels
      parameters:
      - description: Model task, such as chat, vision-chat or embedding
        in: query
        name: task
        type: string
      - description: Input modality the model accepts, such as text or image
        in: query
        name: modality
        type: string
      - description: 'Artifact file format: hf (Hugging Face safetensors) or gguf'
        in: query
        name: format
        type: string
      - description: Engine profile ID an artifact runs on, as listed by GET /engines
        in: query
        name: engine
        type: string
      - description: Artifact source, such as huggingface or ollama
        in: query
        name: source
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: AI model list, ordered by id
          schema:
            $ref: '#/definitions/model.ModelListResp'
      security:
      - BearerAuth: []
      summary: List AI models
      tags:
      - '[Model] AI Model Catalog'
    post:
      consumes:
      - application/json
      description: Register an AI model, or replace the model of the same id with
        this record. A model needs an id, a name and at least one artifact; each artifact
        needs an id unique within the model, a source, a ref, a format and at least
        one compatible engine. Engines are not checked against the engine profiles
        here; a pairing that does not fit is refused when a compose file is rendered
        for it.
      operationId: PostModel
      parameters:
      - description: AI model metadata
        in: body
        name: model
        required: true
        schema:
          $ref: '#/definitions/model.Model'
      produces:
      - application/json
      responses:
        "200":
          description: AI model registered
          schema:
            $ref: '#/definitions/model.Model'
        "400":
          description: Malformed or incomplete metadata
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: The catalog file could not be written
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Register an AI model
      tags:
      - '[Model] AI Model Catalog'
  /models/{modelId}:
    delete:
      description: Remove an AI model from the catalog. Model services already running
        are untouched
      operationId: DeleteModel
      parameters:
      - description: AI model ID
        in: path
        name: modelId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: AI model deleted
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "404":
          description: AI model not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "500":
          description: The catalog file could not be written
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Delete an AI model
      tags:
      - '[Model] AI Model Catalog'
    get:
      description: Read one AI model with every artifact it is published as
      operationId: GetModel
      parameters:
      - default: qwen3-vl-8b
        description: AI model ID
        in: path
        name: modelId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: AI model metadata
          schema:
            $ref: '#/definitions/model.Model'
        "404":
          description: AI model not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Get an AI model
      tags:
      - '[Model] AI Model Catalog'
  /models/{modelId}/artifacts/{artifactId}/compose:
    get:
      description: 'Render the docker-compose.yml that runs one artifact of a model
        with one engine profile, without deploying anything. The pairing is refused
        with 422 unless the artifact lists the engine and the engine loads the artifact
        format. The file starts with one `docker compose up -d`: for vllm it runs
        the OpenAI compatible server with --model set to the artifact ref (and --runner
        pooling for an embedding model); for ollama it runs the server and a one-shot
        container that pulls the model once the server is healthy. HF_TOKEN is left
        to the environment or a .env file beside the compose file.'
      operationId: GetModelCompose
      parameters:
      - default: qwen3-vl-8b
        description: AI model ID
        in: path
        name: modelId
        required: true
        type: string
      - default: hf-bf16
        description: Artifact ID within the model
        in: path
        name: artifactId
        required: true
        type: string
      - description: Engine profile ID. Defaults to the first engine the artifact
          lists
        in: query
        name: engine
        type: string
      - default: false
        description: Reserve every NVIDIA GPU of the node for the engine
        in: query
        name: gpu
        type: boolean
      produces:
      - text/yaml
      - application/json
      responses:
        "200":
          description: docker-compose.yml, as text/yaml
          schema:
            type: string
        "400":
          description: gpu is not a boolean
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "404":
          description: AI model, artifact or engine profile not found
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "422":
          description: The artifact cannot be run with the engine
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      security:
      - BearerAuth: []
      summary: Preview the compose file of a model service
      tags:
      - '[Model] AI Model Catalog'
  /readyz:
    get:
      description: Report whether the service finished initialization and can accept
        requests
      operationId: GetReadyz
      produces:
      - application/json
      responses:
        "200":
          description: Service is ready
          schema:
            $ref: '#/definitions/model.SimpleMsg'
        "503":
          description: Service is still initializing
          schema:
            $ref: '#/definitions/model.SimpleMsg'
      summary: Check service readiness
      tags:
      - '[Health] Service Health'
  /tools:
    get:
      description: List every tool the agent may call, with its risk grade and whether
        the dry-run guard applies. Exposed so another agent framework can adopt the
        same tool surface
      operationId: GetTools
      produces:
      - application/json
      responses:
        "200":
          description: Tool catalog
          schema:
            $ref: '#/definitions/model.ToolListResp'
      security:
      - BearerAuth: []
      summary: List agent tools
      tags:
      - '[Agent] AI Application Automation Agent'
  /ui:
    get:
      description: Serve the single page console that calls this service's own API
      operationId: GetConsole
      produces:
      - text/html
      responses:
        "200":
          description: The console page
          schema:
            type: string
      summary: Open the operator console
      tags:
      - '[Console] Operator Console'
securityDefinitions:
  BearerAuth:
    description: '"Bearer <token>". Required on every route but readiness, the console
      and this documentation when AIAPP_AUTH_TOKEN is set.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
